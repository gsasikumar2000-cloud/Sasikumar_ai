<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SASIKUMAR AI TV - Movies & OTT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eff6ff;color:#172554;font-family:Arial,sans-serif}
header{padding:18px 12px;text-align:center;background:linear-gradient(120deg,#dbeafe,#fce7f3,#dcfce7)}
h1{font-size:22px;margin:5px}
header p{font-size:12px;margin:7px}
main{max-width:720px;margin:14px auto;padding:12px}
.search{display:flex;gap:7px}
input{min-width:0;flex:1;padding:13px;border:1px solid #93c5fd;border-radius:10px;font-size:15px}
button{border:0;border-radius:10px;padding:12px 16px;background:#2563eb;color:white;font-weight:bold}
#status{font-size:13px;text-align:center;margin:15px}
.card{background:white;border-radius:13px;padding:13px;margin:12px 0;box-shadow:0 2px 10px #00000012}
.result{display:flex;gap:12px;align-items:center}
.result button{margin-left:auto}
.poster{width:75px;height:105px;object-fit:cover;border-radius:8px;background:#dbeafe}
h2{font-size:17px;margin:5px 0}
small{color:#64748b}
.source{border-top:1px solid #e2e8f0;padding:10px 0;font-size:13px}
.source a{color:#2563eb;font-weight:bold}
.tag{display:inline-block;background:#dbeafe;padding:4px 7px;border-radius:6px;margin:3px;font-size:11px}
footer{text-align:center;padding:20px;font-size:11px;color:#64748b}
a{overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<div style="font-size:30px">📺</div>
<h1>SASIKUMAR AI TV</h1>
<p>🎬 Movies • TV Shows • Indian OTT Search</p>
</header>
<main>
<div class="search">
<input id="query" placeholder="Enter movie or series name..." autocomplete="off">
<button onclick="searchMovies()">SEARCH</button>
</div>
<div id="status">Search your favourite movie or TV series.</div>
<div id="results"></div>
<div id="details"></div>
</main>
<footer>🤖 SASIKUMAR AI STUDIO • Powered by Watchmode</footer>
<script>
const $=id=>document.getElementById(id);
function safe(v){
 return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
$('query').addEventListener('keydown',e=>{if(e.key==='Enter')searchMovies()});

async function searchMovies(){
 const q=$('query').value.trim();
 if(!q){$('status').textContent='Please enter a movie or series name.';return}
 $('status').textContent='🔎 Searching movies and series...';
 $('results').innerHTML='';
 $('details').innerHTML='';
 try{
  const r=await fetch('/api/tv/watchmode/search?q='+encodeURIComponent(q));
  const data=await r.json();
  if(!r.ok||!data.success)throw new Error(data.error||'Search failed');
  const items=data.results||[];
  if(!items.length){$('status').textContent='No results found.';return}
  $('status').textContent='✅ Found '+items.length+' results';
  $('results').innerHTML=items.map(item=>`
   <div class="card result">
    <div style="font-size:32px">🎬</div>
    <div style="flex:1">
     <b>${safe(item.name)}</b><br>
     <small>${safe(item.type||'Title')} • ${safe(item.year||'Year unavailable')}</small>
    </div>
    <button onclick="showDetails(${Number(item.id)})">VIEW</button>
   </div>`).join('');
 }catch(e){$('status').textContent='⚠️ '+e.message}
}

async function showDetails(id){
 $('details').innerHTML='<div class="card">Loading movie details and OTT platforms...</div>';
 try{
  const [dr,sr]=await Promise.all([
   fetch('/api/tv/watchmode/details/'+id),
   fetch('/api/tv/watchmode/sources/'+id)
  ]);
  const dd=await dr.json();
  const sd=await sr.json();
  if(!dr.ok||!dd.success)throw new Error(dd.error||'Details unavailable');
  const d=dd.details||dd.result||{};
  const sources=sd.sources||[];
  const poster=d.poster||d.poster_url||'';
  const title=d.title||d.name||'Movie details';
  $('details').innerHTML=`
   <div class="card">
    <h2>🎬 ${safe(title)}</h2>
    <div class="result">
     ${poster?`<img class="poster" src="${safe(poster)}" alt="Movie poster" onerror="this.style.display='none'">`:'<div class="poster"></div>'}
     <div>
      <b>${safe(d.year||'')}</b><br>
      <small>${safe(d.genre_names||d.genres||'')}</small><br>
      <small>${safe(d.runtime_minutes?d.runtime_minutes+' minutes':d.runtime||'')}</small><br>
      <small>⭐ ${safe(d.user_rating||d.rating||'Rating unavailable')}</small>
     </div>
    </div>
    <p style="font-size:13px;line-height:1.5">${safe(d.plot_overview||d.plot||'No description available.')}</p>
    ${d.trailer?`<a href="${safe(d.trailer)}" target="_blank" rel="noopener">▶ Watch Trailer</a>`:''}
   </div>
   <div class="card">
    <h2>📺 India OTT Availability</h2>
    ${sources.length?sources.map(s=>`
     <div class="source">
      <b>${safe(s.name||s.source_name||'Streaming platform')}</b>
      <span class="tag">${safe(s.type||'Available')}</span>
      <span class="tag">${safe(s.format||'')}</span>
      ${s.price?`<span class="tag">₹${safe(s.price)}</span>`:''}
      ${s.web_url&&/^https?:\/\//i.test(s.web_url)?`<br><a href="${safe(s.web_url)}" target="_blank" rel="noopener">Open platform ↗</a>`:''}
     </div>`).join(''):'<p style="font-size:13px">No OTT listings found for India.</p>'}
    <small>Availability and prices may change. Please verify with the platform.</small>
   </div>`;
  $('details').scrollIntoView({behavior:'smooth'});
 }catch(e){$('details').innerHTML='<div class="card">⚠️ '+safe(e.message)+'</div>'}
}
</script>
</body>
</html>
