<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings - SASIKUMAR AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef4ff;color:#17243b}
header{background:linear-gradient(135deg,#102347,#1769aa);color:white;padding:24px;text-align:center}
header img{width:42px;height:42px;object-fit:contain}
main{max-width:700px;margin:20px auto;padding:0 14px}
.card{background:white;padding:20px;margin:15px 0;border-radius:16px;box-shadow:0 3px 12px #1233}
a,button{display:inline-block;padding:12px 15px;margin:5px;border:0;border-radius:9px;background:#1769aa;color:white;text-decoration:none;font-weight:bold;cursor:pointer}
p{line-height:1.6}
</style>

<style id="sk_all_logo_spin_v2">
@keyframes skAllLogoSpinV2 {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
</style>

</head>
<body>
<header>
<img src="/assets/sasikumar-ai-logo.png" alt="SASIKUMAR AI">
<h1>⚙️ SASIKUMAR AI</h1>
<p>Settings & Preferences</p>
</header>
<main>
<section class="card">
<h2>🏠 Navigation</h2>
<a href="/">← Home Page</a>
<a href="/hub-dashboard.html">AI HUB</a>
</section>
<section class="card">
<h2>🎨 Display Settings</h2>
<p>Dark Mode: <button id="darkToggle" type="button">Enable</button></p>
</section>
<section class="card">
<h2>📄 Information & Support</h2>
<p><a href="/privacy-policy.html">🔒 Privacy Policy</a></p>
<p><a href="/disclaimer.html">⚠️ Disclaimer</a></p>
<p><a href="/mission.html">🎯 Mission</a></p>
<p><a href="/vision.html">👁️ Vision</a></p>
<p><a href="/communication.html">📞 Communication</a></p>
<p><a href="/customer-feedback.html">💬 Customer Feedback</a></p>
</section>
</main>
<script>
const btn=document.getElementById("darkToggle");
function applyDark(on){
 document.body.style.background=on?"#101827":"#eef4ff";
 document.body.style.color=on?"#f1f5fb":"#17243b";
 document.querySelectorAll(".card").forEach(c=>{
  c.style.background=on?"#1c293b":"white";
  c.style.color=on?"#f1f5fb":"#17243b";
 });
 btn.textContent=on?"Disable":"Enable";
 localStorage.setItem("sasikumar_settings_dark",on?"on":"off");
}
applyDark(localStorage.getItem("sasikumar_settings_dark")==="on");
btn.addEventListener("click",()=>applyDark(localStorage.getItem("sasikumar_settings_dark")!=="on"));
</script>

<script id="skGlobalExitButtonScript">
(function () {
  if (document.getElementById("skGlobalExitButton")) return;

  var style = document.createElement("style");
  style.id = "skGlobalExitButtonStyle";
  style.textContent = `
    #skGlobalExitButton {
      position: fixed !important;
      top: calc(env(safe-area-inset-top, 0px) + 10px) !important;
      right: calc(env(safe-area-inset-right, 0px) + 10px) !important;
      z-index: 2147483647 !important;
      width: 42px !important;
      height: 42px !important;
      min-width: 42px !important;
      min-height: 42px !important;
      padding: 0 !important;
      border: 2px solid #fff !important;
      border-radius: 50% !important;
      background: #e53935 !important;
      color: #fff !important;
      font: bold 30px/36px Arial, sans-serif !important;
      text-align: center !important;
      box-shadow: 0 3px 12px #0005 !important;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      -webkit-tap-highlight-color: transparent;
    }
    #skGlobalExitButton:active {
      transform: scale(.92);
    }
  `;
  document.head.appendChild(style);

  var btn = document.createElement("button");
  btn.id = "skGlobalExitButton";
  btn.type = "button";
  btn.textContent = "\u00D7";
  btn.title = "Close / Exit";
  btn.setAttribute("aria-label", "Close page");

  btn.addEventListener("click", function () {
    window.close();
    window.setTimeout(function () {
      if (!window.closed) {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "/";
        }
      }
    }, 150);
  });

  document.body.appendChild(btn);
})();
</script>


<script id="sk_all_logo_spin_v2-script">
(function () {
  function spinLogo(img) {
    if (!img || !/sasikumar-ai-logo\.png/i.test(img.getAttribute('src') || '')) return;
    img.style.setProperty('animation', 'skAllLogoSpinV2 3s linear infinite', 'important');
  }
  function scan(root) {
    if (root.matches && root.matches('img')) spinLogo(root);
    if (root.querySelectorAll) root.querySelectorAll('img').forEach(spinLogo);
  }
  scan(document);
  new MutationObserver(function (records) {
    records.forEach(function (record) {
      if (record.type === 'attributes') spinLogo(record.target);
      else record.addedNodes.forEach(function (node) {
        if (node.nodeType === 1) scan(node);
      });
    });
  }).observe(document.documentElement, {
    subtree: true, childList: true, attributes: true, attributeFilter: ['src']
  });
})();
</script>

</body>
</html>
