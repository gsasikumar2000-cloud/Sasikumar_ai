<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>SASIKUMAR OFFLINE AI STUDIO</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:system-ui,sans-serif;
 color:#172554;
 background:linear-gradient(135deg,#dbeafe,#ede9fe,#dcfce7);
 min-height:100vh
}
header{
 text-align:center;
 padding:22px 12px;
 background:linear-gradient(120deg,#2563eb,#7c3aed,#0891b2);
 color:white
}
.logo{
 width:88px;height:88px;object-fit:contain;
 border-radius:50%;background:white;padding:5px;
 animation:spin 12s linear infinite;
 box-shadow:0 0 22px #ffffff88
}
@keyframes spin{to{transform:rotate(360deg)}}
header h1{font-size:22px;margin:10px 0 4px}
header p{margin:0;font-size:13px}
main{max-width:760px;margin:16px auto;padding:0 11px 25px}
.panel{
 background:white;border-radius:19px;padding:15px;
 margin-bottom:13px;
 box-shadow:0 5px 22px #1e3a8a16
}
.status{font-size:13px;color:#15803d;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button,.filebtn{
 border:0;border-radius:11px;padding:11px 13px;
 font:inherit;font-weight:650
}
select{background:#eff6ff;color:#1e40af;flex:1;min-width:150px}
button,.filebtn{cursor:pointer}
button:disabled{opacity:.5}
textarea{
 width:100%;min-height:100px;resize:vertical;
 border:1px solid #cbd5e1;border-radius:13px;
 padding:12px;font:inherit;outline-color:#2563eb
}
#messages{
 min-height:170px;max-height:48vh;
 overflow-y:auto;padding:4px 0
}
.msg{
 padding:12px 14px;border-radius:14px;
 margin:9px 0;white-space:pre-wrap;
 overflow-wrap:anywhere;line-height:1.55
}
.user{background:#dbeafe;margin-left:10%;border-bottom-right-radius:4px}
.ai{background:#dcfce7;margin-right:7%;border-bottom-left-radius:4px}
.label{font-size:12px;font-weight:750;color:#475569;margin-bottom:5px}
.primary{background:#2563eb;color:white;flex:1}
.secondary{background:#e2e8f0;color:#334155}
.purple{background:#ede9fe;color:#5b21b6}
.green{background:#dcfce7;color:#166534}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.tools button,.tools label{font-size:13px}
#send{width:100%;margin-top:9px}
#preview{
 display:none;max-width:100%;max-height:220px;
 object-fit:contain;border-radius:12px;margin-top:10px
}
.small{font-size:12px;color:#64748b;line-height:1.5}
footer{text-align:center;padding:14px;font-size:12px;color:#475569}
input[type=file]{display:none}
@media(max-width:420px){
 header h1{font-size:19px}
 .panel{padding:12px}
 button,.filebtn{padding:10px;font-size:13px}
}
</style>
</head>
<body>
<header>
 <img class="logo" src="/sasikumar-ai-logo.png" alt="SASIKUMAR AI Logo">
 <h1>SASIKUMAR OFFLINE AI</h1>
 <p>தமிழ் & English · Local AI Studio</p>
</header>

<main>
<section class="panel">
 <div class="status" id="status">🟡 Connecting to Local AI...</div>
 <div class="row">
  <strong>🧠 AI Model</strong>
  <select id="model">
   <option value="tamil-ai">Tamil LM 2B</option>
   <option value="qwen-ai">Qwen 2.5 1.5B</option>
  </select>
  <button class="purple" id="switchModel">🔁 Switch</button>
 </div>
 <p class="small" id="modelInfo">ஒரு நேரத்தில் ஒரு Model மட்டும் இயங்கும்.</p>
</section>

<section class="panel">
 <div id="messages" aria-live="polite">
  <div class="msg ai">
   <div class="label">SASIKUMAR AI</div>
   வணக்கம்! நான் உங்கள் Offline AI. என்ன உதவி வேண்டும்?
  </div>
 </div>

 <form id="chat">
  <textarea id="question" placeholder="உங்கள் கேள்வியை எழுதுங்கள்... / Type your question"></textarea>

  <div class="tools">
   <label class="filebtn purple" for="fileInput">📁 Upload Text</label>
   <input id="fileInput" type="file" accept=".txt,.md,.csv,text/plain,text/markdown,text/csv">

   <label class="filebtn green" for="cameraInput">📷 Camera</label>
   <input id="cameraInput" type="file" accept="image/*" capture="environment">

   <button type="button" class="secondary" id="voiceIn">🎤 Voice</button>
   <button type="button" class="secondary" id="voiceOut">🔊 Read</button>
  </div>

  <img id="preview" alt="Selected image preview">
  <div class="small" id="fileInfo"></div>

  <button id="send" class="primary" type="submit">➤ Send to AI</button>
 </form>

 <div class="tools">
  <button class="secondary" id="copy">📋 Copy Last Answer</button>
  <button class="secondary" id="download">💾 Download Chat</button>
  <button class="secondary" id="clear">🗑 Clear Chat</button>
 </div>
</section>
</main>

<footer>
 🔒 Local device AI · SASIKUMAR AI STUDIO<br>
 Tamil LM / Qwen · Your device
</footer>

<script>
const messages=document.getElementById('messages');
const question=document.getElementById('question');
const send=document.getElementById('send');
const statusBox=document.getElementById('status');
const modelSelect=document.getElementById('model');
const modelInfo=document.getElementById('modelInfo');
const fileInfo=document.getElementById('fileInfo');
const preview=document.getElementById('preview');

const history=[{
 role:'system',
 content:'You are SASIKUMAR OFFLINE AI. Reply in the language used by the user. Give clear and useful answers. If unsure, say so.'
}];

let lastAnswer='';
let attachedText='';
let recognition=null;
let switching=false;

function addMessage(text,who){
 const box=document.createElement('div');
 box.className='msg '+who;
 const label=document.createElement('div');
 label.className='label';
 label.textContent=who==='user'?'நீங்கள் / You':'SASIKUMAR AI';
 const content=document.createElement('div');
 content.textContent=text;
 box.append(label,content);
 messages.appendChild(box);
 messages.scrollTop=messages.scrollHeight;
 return box;
}

const API_BASE =
  (location.hostname === '127.0.0.1' ||
   location.hostname === 'localhost')
  ? ''
  : 'http://127.0.0.1:8081';

async function checkHealth(){
 try{
  const r=await fetch(API_BASE+'/health');
  const d=await r.json();
  if(!r.ok||!d.ai)throw Error();
  statusBox.textContent='🟢 Local AI Connected';
 }catch{
  statusBox.textContent='🟠 AI Server unavailable. Check Termux server.';
 }
}

async function loadModel(){
 try{
  const r=await fetch(API_BASE+'/api/model');
  if(!r.ok)throw Error();
  const d=await r.json();
  modelSelect.value=d.model;
  modelInfo.textContent='தற்போதைய Model: '+d.name;
 }catch{
  modelInfo.textContent='Model தகவல் கிடைக்கவில்லை. Proxy restart தேவைப்படலாம்.';
 }
}

document.getElementById('switchModel').addEventListener('click',async()=>{
 if(switching)return;
 const id=modelSelect.value;
 switching=true;
 const btn=document.getElementById('switchModel');
 btn.disabled=true;
 btn.textContent='⏳ Loading...';
 statusBox.textContent='🟡 Model மாற்றப்படுகிறது. காத்திருக்கவும்...';
 try{
  const r=await fetch(API_BASE+'/api/model',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({model:id})
  });
  const d=await r.json();
  if(!r.ok)throw Error(d.error||'Model switch failed');
  modelInfo.textContent='தற்போதைய Model: '+d.name;
  statusBox.textContent='🟢 '+d.name+' Ready';
  history.splice(1);
  messages.replaceChildren();
  addMessage(d.name+' Model தயாராக உள்ளது. கேள்வி கேட்கலாம்!','ai');
 }catch(e){
  statusBox.textContent='🔴 Model மாற்றப் பிழை: '+e.message;
 }finally{
  switching=false;
  btn.disabled=false;
  btn.textContent='🔁 Switch';
 }
});

document.getElementById('chat').addEventListener('submit',async e=>{
 e.preventDefault();
 const text=question.value.trim();
 if(!text)return;
 question.value='';
 const prompt=attachedText
  ?text+'\n\nகீழே உள்ள கோப்பின் உள்ளடக்கத்தைப் பயன்படுத்தவும்:\n'+attachedText
  :text;
 attachedText='';
 fileInfo.textContent='';
 addMessage(text,'user');
 history.push({role:'user',content:prompt});
 send.disabled=true;
 send.textContent='⏳ Thinking...';
 const pending=addMessage('பதில் தயாராகிறது...','ai');
 try{
  const response=await fetch(API_BASE+'/v1/chat/completions',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    model:modelSelect.value,
    messages:history,
    max_tokens:220,
    temperature:0.3
   })
  });
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'AI request failed');
  const answer=data.choices?.[0]?.message?.content;
  if(!answer)throw Error('Empty AI response');
  pending.lastChild.textContent=answer;
  history.push({role:'assistant',content:answer});
  lastAnswer=answer;
 }catch(err){
  pending.lastChild.textContent='பிழை: '+err.message;
  history.pop();
 }finally{
  send.disabled=false;
  send.textContent='➤ Send to AI';
  question.focus();
 }
});

document.getElementById('fileInput').addEventListener('change',async e=>{
 const file=e.target.files[0];
 if(!file)return;
 if(file.size>1024*1024){
  fileInfo.textContent='கோப்பு 1 MB-க்கு குறைவாக இருக்க வேண்டும்.';
  e.target.value='';
  return;
 }
 try{
  attachedText=await file.text();
  fileInfo.textContent='📁 '+file.name+' இணைக்கப்பட்டது. கேள்வியுடன் Send செய்யுங்கள்.';
 }catch{
  fileInfo.textContent='இந்த கோப்பைப் படிக்க முடியவில்லை.';
 }
 e.target.value='';
});

document.getElementById('cameraInput').addEventListener('change',e=>{
 const file=e.target.files[0];
 if(!file)return;
 const url=URL.createObjectURL(file);
 preview.src=url;
 preview.style.display='block';
 fileInfo.textContent='📷 படம் Preview செய்யப்படுகிறது. தற்போதைய Text AI படத்தை நேரடியாகப் புரிந்துகொள்ளாது.';
 e.target.value='';
});

document.getElementById('voiceIn').addEventListener('click',()=>{
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  alert('இந்த Browser-ல் Voice Recognition ஆதரவு இல்லை.');
  return;
 }
 if(recognition){
  recognition.stop();
  recognition=null;
 }
 recognition=new SpeechRecognition();
 recognition.lang='ta-IN';
 recognition.interimResults=false;
 recognition.onresult=e=>{
  question.value+=(question.value?' ':'')+e.results[0][0].transcript;
  question.focus();
 };
 recognition.onerror=()=>statusBox.textContent='🎤 Voice input unavailable';
 recognition.onend=()=>recognition=null;
 recognition.start();
 statusBox.textContent='🎤 பேசுங்கள்...';
});

document.getElementById('voiceOut').addEventListener('click',()=>{
 if(!lastAnswer){
  alert('முதலில் AI பதில் பெறுங்கள்.');
  return;
 }
 if(!('speechSynthesis' in window)){
  alert('Voice Output ஆதரவு இல்லை.');
  return;
 }
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(lastAnswer);
 utterance.lang=/[\u0B80-\u0BFF]/.test(lastAnswer)?'ta-IN':'en-US';
 speechSynthesis.speak(utterance);
});

document.getElementById('copy').addEventListener('click',async()=>{
 if(!lastAnswer){
  alert('Copy செய்ய AI பதில் இல்லை.');
  return;
 }
 try{
  await navigator.clipboard.writeText(lastAnswer);
  alert('AI பதில் Copy செய்யப்பட்டது.');
 }catch{
  alert('இந்த Browser-ல் Copy வசதி கிடைக்கவில்லை.');
 }
});

document.getElementById('download').addEventListener('click',()=>{
 const text=history.map(m=>m.role.toUpperCase()+':\n'+m.content).join('\n\n');
 const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download='sasikumar-offline-ai-chat.txt';
 a.click();
 URL.revokeObjectURL(url);
});

document.getElementById('clear').addEventListener('click',()=>{
 messages.replaceChildren();
 history.splice(1);
 lastAnswer='';
 attachedText='';
 fileInfo.textContent='';
 preview.style.display='none';
 question.value='';
 addMessage('புதிய உரையாடல் தொடங்கலாம்!','ai');
});

question.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){
  e.preventDefault();
  document.getElementById('chat').requestSubmit();
 }
});

checkHealth();
loadModel();
</script>
