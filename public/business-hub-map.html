<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SASIKUMAR AI - Business Hub Map</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#06152b,#123b68);color:#fff}
.wrap{max-width:900px;margin:auto;padding:18px}
.card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:18px;box-shadow:0 15px 40px rgba(0,0,0,.3)}
h1{margin:0 0 6px;font-size:25px}
.sub{opacity:.8;margin-bottom:15px}
button{border:0;border-radius:14px;padding:13px 16px;margin:5px;cursor:pointer;font-weight:700}
.live{background:#20c997;color:#fff}
.refresh{background:#ffc107;color:#111}
.map{margin-top:15px;height:430px;border-radius:20px;overflow:hidden;background:#dfe8ef;position:relative}
.map iframe{width:100%;height:100%;border:0}
.status{margin-top:12px;padding:12px;border-radius:14px;background:rgba(0,0,0,.22)}
.coords{font-size:14px;line-height:1.7}
.actions{margin-top:10px}
a{color:#fff;text-decoration:none}
</style>

<style id="sk_all_logo_spin_v2">
@keyframes skAllLogoSpinV2 {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
</style>

</head>
<body>

<!-- SASIKUMAR AI BRAND HEADER -->
<div id="skGlobalBrandHeader" style="box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:9px 14px;margin:0 0 12px;background:linear-gradient(110deg,#071b38,#123f65,#075b55);color:#fff;border-bottom:2px solid #d8b54a;font-family:Arial,sans-serif;position:relative;z-index:5;">
  <img src="/assets/sasikumar-ai-logo.png?v=20261010" alt="SASIKUMAR AI"
       style="display:block;width:42px;height:42px;min-width:42px;object-fit:contain;cursor:pointer;transition:transform .5s ease;"
       onclick="this.style.transform='rotate(360deg)';setTimeout(()=>this.style.transform='',550)">
  <div style="min-width:0;">
    <div style="font-size:16px;font-weight:800;letter-spacing:.5px;line-height:1.35;">SASIKUMAR AI</div>
    <div style="font-size:11px;opacity:.88;line-height:1.4;">Smart Digital Services</div>
  </div>
</div>
<!-- END SASIKUMAR AI BRAND HEADER -->

<div class="wrap">
<div class="card">
<h1>🗺️ SASIKUMAR AI BUSINESS HUB</h1>
<div class="sub">Map & Live Location</div>

<button class="live" onclick="getLocation()">📍 My Live Location</button>
<button class="refresh" onclick="getLocation()">🔄 Refresh Location</button>

<div id="status" class="status">Location permission required to show your live position.</div>

<div class="map">
<iframe id="mapFrame" title="Business Hub Map"
src="https://maps.google.com/maps?q=Kumbakonam&z=12&output=embed">
</iframe>
</div>

<div class="actions">
  <button class="live" onclick="openGoogleMaps()">🗺️ Google Maps</button>
  <button class="refresh" onclick="getDirections()">🧭 Directions</button>
  <button onclick="nearby('shop')">🏪 Nearby Shops</button>
  <button onclick="nearby('hospital')">🏥 Hospitals</button>
  <button onclick="nearby('bank')">🏦 Banks</button>
  <button onclick="nearby('hotel')">🍽️ Hotels</button>
  <button onclick="nearby('service')">🔧 Services</button>
  <button onclick="shareLocation()">📤 Share Location</button>
 </div>
</div>
</div>

<script>
let lat=null,lon=null;

function getLocation(){
 const status=document.getElementById("status");
 if(!navigator.geolocation){
   status.innerHTML="❌ Geolocation is not supported by this browser.";
   return;
 }
 status.innerHTML="📍 Requesting live location permission...";
 navigator.geolocation.getCurrentPosition(
  function(pos){
   lat=pos.coords.latitude;
   lon=pos.coords.longitude;
   const acc=Math.round(pos.coords.accuracy);
   status.innerHTML=
    "✅ Live Location Ready<br>"+
    "<span class='coords'>Latitude: "+lat.toFixed(6)+
    "<br>Longitude: "+lon.toFixed(6)+
    "<br>Accuracy: approximately "+acc+" metres</span>";

   document.getElementById("mapFrame").src="https://maps.google.com/maps?q="+lat+","+lon+"&z=16&output=embed";
  },
  function(err){
   let msg="❌ Location unavailable.";
   if(err.code===1) msg="❌ Location permission was denied. Please allow location access.";
   if(err.code===2) msg="❌ Location could not be determined.";
   if(err.code===3) msg="❌ Location request timed out.";
   status.innerHTML=msg;
  },
  {enableHighAccuracy:true,timeout:15000,maximumAge:0}
 );
}

function openGoogleMaps(){
  if(lat===null || lon===null){getLocation();return;}
  window.open("https://www.google.com/maps/search/?api=1&query="+lat+","+lon,"_blank");
 }

 function getDirections(){
  if(lat===null || lon===null){getLocation();return;}
  window.open("https://www.google.com/maps/dir/?api=1&origin="+lat+","+lon,"_blank");
 }

 async function nearby(type){
  if(lat===null || lon===null){getLocation();return;}

  const status=document.getElementById("status");
  status.textContent="🔎 Searching nearby places...";
  try {
   const params=new URLSearchParams({
    lat:String(lat), lon:String(lon), type:type, radius:"3000"
   });
   const response=await fetch("/api/maps/nearby?"+params.toString());
   const data=await response.json();

   if(!response.ok || !data.ok){
    throw new Error(data.error || "Nearby search failed.");
   }

   const features=Array.isArray(data.features)?data.features:[];
   status.replaceChildren();

   const heading=document.createElement("strong");
   heading.textContent="📍 Nearby "+type+" ("+features.length+" found)";
   status.appendChild(heading);

   if(!features.length){
    const empty=document.createElement("p");
    empty.textContent="No places found within 3 km. Try another category or refresh location.";
    status.appendChild(empty);
    return;
   }

   const list=document.createElement("div");
   list.style.marginTop="10px";

   features.forEach(function(feature,index){
    const props=feature.properties||{};
    const coords=feature.geometry&&feature.geometry.coordinates;
    const name=props.name||props.address_line1||"Unnamed place";
    const address=props.formatted||props.address_line2||"Address not available";

    const item=document.createElement("div");
    item.style.cssText="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.25)";

    const title=document.createElement("strong");
    title.textContent=(index+1)+". "+name;
    item.appendChild(title);

    const detail=document.createElement("div");
    detail.textContent=address;
    detail.style.cssText="font-size:13px;margin:5px 0";
    item.appendChild(detail);

    if(Array.isArray(coords)&&coords.length>=2){
     const link=document.createElement("a");
     link.href="https://www.google.com/maps/search/?api=1&query="+
       encodeURIComponent(coords[1]+","+coords[0]);
     link.target="_blank";
     link.rel="noopener";
     link.textContent="🗺️ Open in Google Maps";
     item.appendChild(link);
    }

    list.appendChild(item);
   });

   status.appendChild(list);

   const first=features[0];
   const firstCoords=first.geometry&&first.geometry.coordinates;
   if(Array.isArray(firstCoords)&&firstCoords.length>=2){
    document.getElementById("mapFrame").src=
     "https://maps.google.com/maps?q="+firstCoords[1]+","+firstCoords[0]+"&z=16&output=embed";
   }
  } catch(error) {
   status.textContent="❌ "+error.message;
  }
 }

 function shareLocation(){
  if(lat===null || lon===null){getLocation();return;}
  const url="https://www.google.com/maps?q="+lat+","+lon;
  const message="My Live Location: "+url;
  window.open("https://wa.me/?text="+encodeURIComponent(message),"_blank");
 }
</script>

<script id="skGlobalExitButtonScript">
(function () {
  if (document.getElementById("skGlobalExitButton")) return;

  var style = document.createElement("style");
  style.id = "skGlobalExitButtonStyle";
  style.textContent = `
    #skGlobalExitButton {
      position: fixed !important;
      top: calc(env(safe-area-inset-top, 0px) + 10px) !important;
      right: calc(env(safe-area-inset-right, 0px) + 10px) !important;
      z-index: 2147483647 !important;
      width: 42px !important;
      height: 42px !important;
      min-width: 42px !important;
      min-height: 42px !important;
      padding: 0 !important;
      border: 2px solid #fff !important;
      border-radius: 50% !important;
      background: #e53935 !important;
      color: #fff !important;
      font: bold 30px/36px Arial, sans-serif !important;
      text-align: center !important;
      box-shadow: 0 3px 12px #0005 !important;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      -webkit-tap-highlight-color: transparent;
    }
    #skGlobalExitButton:active {
      transform: scale(.92);
    }
  `;
  document.head.appendChild(style);

  var btn = document.createElement("button");
  btn.id = "skGlobalExitButton";
  btn.type = "button";
  btn.textContent = "\u00D7";
  btn.title = "Close / Exit";
  btn.setAttribute("aria-label", "Close page");

  btn.addEventListener("click", function () {
    window.close();
    window.setTimeout(function () {
      if (!window.closed) {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "/";
        }
      }
    }, 150);
  });

  document.body.appendChild(btn);
})();
</script>


<script id="sk_all_logo_spin_v2-script">
(function () {
  function spinLogo(img) {
    if (!img || !/sasikumar-ai-logo\.png/i.test(img.getAttribute('src') || '')) return;
    img.style.setProperty('animation', 'skAllLogoSpinV2 3s linear infinite', 'important');
  }
  function scan(root) {
    if (root.matches && root.matches('img')) spinLogo(root);
    if (root.querySelectorAll) root.querySelectorAll('img').forEach(spinLogo);
  }
  scan(document);
  new MutationObserver(function (records) {
    records.forEach(function (record) {
      if (record.type === 'attributes') spinLogo(record.target);
      else record.addedNodes.forEach(function (node) {
        if (node.nodeType === 1) scan(node);
      });
    });
  }).observe(document.documentElement, {
    subtree: true, childList: true, attributes: true, attributeFilter: ['src']
  });
})();
</script>

</body>
</html>
