<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASIKUMAR AI 🐼</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',Arial,sans-serif}
body{background:#050508;color:#fff;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 10%,#00ff8822 0%,transparent 40%),radial-gradient(circle at 80% 90%,#00ccff22 0%,transparent 40%),#050508}
.header{backdrop-filter:blur(20px);background:rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.1);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo span{width:36px;height:36px;background:linear-gradient(135deg,#00ff88,#00ccff);border-radius:10px;display:grid;place-items:center;color:#000;font-size:20px}
.status{font-size:12px;padding:6px 12px;border-radius:20px;background:rgba(0,255,136,0.15);border:1px solid rgba(0,255,136,0.3);color:#00ff88}
#chat{flex:1;overflow-y:auto;padding:20px 16px 90px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:85%;padding:14px 16px;border-radius:18px;line-height:1.5;font-size:15px;word-wrap:break-word;animation:pop 0.3s ease}
@keyframes pop{from{transform:translateY(10px) scale(0.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.user{align-self:flex-end;background:linear-gradient(135deg,#00ff88,#00ccff);color:#000;border-bottom-right-radius:6px;font-weight:500}
.ai{align-self:flex-start;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-bottom-left-radius:6px;backdrop-filter:blur(10px)}
.ai b{color:#00ff88}
.think{align-self:flex-start;background:rgba(255,255,255,0.05);color:#888;padding:10px 14px;border-radius:18px;font-size:13px}
.inputBar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:rgba(10,10,15,0.8);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);display:flex;gap:10px;align-items:center}
.inputBar input{flex:1;padding:14px 18px;border-radius:28px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.07);color:#fff;outline:none;font-size:15px}
.inputBar input::placeholder{color:#777}
.inputBar button{width:48px;height:48px;border-radius:50%;border:none;background:linear-gradient(135deg,#00ff88,#00ccff);color:#000;font-size:20px;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 15px rgba(0,255,136,0.3)}
.hint{font-size:11px;color:#666;text-align:center;padding:8px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="header">
<div class="logo"><span>🐼</span> SASIKUMAR AI</div>
<div id="status" class="status">● Checking...</div>
</div>
<div id="chat"></div>
<div class="inputBar">
<input id="msg" placeholder="Message Panda..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
<script>
let category='panda';
async function check(){
 try{
  let r=await fetch('/health');let j=await r.json();
  let g=j.gemini?'✅':'';let q=j.groq?'✅':'❌';
  document.getElementById('status').innerHTML='🟢 LIVE | Groq: '+q+' '+g;
  document.getElementById('status').style.background=j.groq?'rgba(0,255,136,0.15)':'rgba(255,68,68,0.15)';
 }catch(e){document.getElementById('status').innerHTML='🔴 Offline'}
}
function add(text,cls){
 let d=document.createElement('div');d.className='bubble '+cls;d.innerHTML=text;
 document.getElementById('chat').appendChild(d);
 document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight;
}
async function send(){
 let m=document.getElementById('msg').value.trim();if(!m)return;
 add(m,'user');document.getElementById('msg').value='';
 let t=document.createElement('div');t.className='think';t.innerText='🐼 Panda thinking...';document.getElementById('chat').appendChild(t);
 document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight;
 try{
  let res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,category:category})});
  let data=await res.json();t.remove();
  add((data.reply||data.error||'Error da!'), 'ai');
 }catch(e){t.remove();add('Network error da Sir! '+e.message,'ai')}
}
check();
setTimeout(()=>{add('<b>🐼 Panda AI</b><br>Vanakkam Sir! Naan Panda! 😎<br>Enaku edhu venalum kelu Sir - jokes, code, growth tips ellam ready!','ai')},600);
</script>
</body>
</html>
