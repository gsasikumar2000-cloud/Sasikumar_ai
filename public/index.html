<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SASIKUMAR AI - VARUM AI Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(90deg,#00ff88,#00d4ff);padding:15px;text-align:center;color:#000;font-weight:900;font-size:22px;position:sticky;top:0;z-index:10}
.main{flex:1;padding:15px;padding-bottom:220px;max-width:900px;margin:0 auto;width:100%}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:15px;margin:10px 0}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.tool-btn{background:#222;border:2px solid #444;border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:.2s}
.tool-btn.active{border-color:#00ff88;background:#00ff8820}
.tool-btn h3{font-size:14px;margin:5px 0}
.reply-box{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:2px solid #00ff88;padding:12px;z-index:100}
.input-row{display:flex;gap:8px;max-width:900px;margin:0 auto}
#userInput{flex:1;background:#222;border:1px solid #444;color:#fff;border-radius:25px;padding:12px 18px;font-size:15px;outline:none}
#sendBtn{background:#00ff88;color:#000;border:none;border-radius:25px;padding:12px 22px;font-weight:900;cursor:pointer}
.log{white-space:pre-wrap;background:#000;padding:10px;border-radius:8px;margin:8px 0;font-size:13px;border-left:3px solid #00ff88}
.status-ok{color:#00ff88}.status-demo{color:#ffaa00}
</style>
</head>
<body>
<div class="header">🚀 SASIKUMAR AI | VARUM AI - All Tools Bottom Reply</div>
<div class="main">
<div class="card"><b>💰 Live Gold</b><div id="goldBox">Loading...</div></div>
<div class="tool-grid">
<div class="tool-btn active" data-tool="growth" onclick="setTool('growth')"><h3>📈 Growth</h3><small>Varum Advice</small></div>
<div class="tool-btn" data-tool="gold" onclick="setTool('gold')"><h3>💰 Gold</h3><small>Chennai Rate</small></div>
<div class="tool-btn" data-tool="finance" onclick="setTool('finance')"><h3>💳 Finance</h3><small>Money Plan</small></div>
<div class="tool-btn" data-tool="tamil" onclick="setTool('tamil')"><h3>🗣️ Tamil AI</h3><small>Tanglish Chat</small></div>
</div>
<div id="chatLogs"></div>
<div class="card" id="healthBox">Checking health...</div>
</div>
<div class="reply-box">
<div class="input-row">
<input id="userInput" placeholder="Varum! Enna help venum? Growth / Gold / Finance... Type pannunga!" onkeypress="if(event.key==='Enter')send()">
<button id="sendBtn" onclick="send()">SEND 🚀</button>
</div>
<div style="text-align:center;font-size:11px;margin-top:6px;color:#666" id="toolLabel">Active Tool: 📈 Growth | All replies keela order la varum</div>
</div>
<script>
let curTool='growth';
function setTool(t){
curTool=t;
document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
document.querySelector(`[data-tool="${t}"]`).classList.add('active');
document.getElementById('toolLabel').innerText='Active Tool: '+t.toUpperCase()+' | Bottom reply box ready';
document.getElementById('userInput').placeholder=t+' pathi ketkalam! Type pannunga...';
}
async function loadHealth(){
try{
let r=await fetch('/health');let j=await r.json();
document.getElementById('healthBox').innerHTML=`<b>Health:</b> <span class="status-ok">${j.status}</span> | Tavily: ${j.tavily} | Gemini: ${j.gemini}<br><small>${j.time}</small>`;
document.getElementById('goldBox').innerHTML='System OK - '+j.tavily;
}catch(e){document.getElementById('healthBox').innerHTML='Health check fail - Refresh pannunga';}
}
function addLog(title,txt){
let div=document.createElement('div');div.className='log';
div.innerHTML=`<b>[${new Date().toLocaleTimeString()}] ${title}</b>\n${txt}`;
document.getElementById('chatLogs').appendChild(div);
window.scrollTo(0,document.body.scrollHeight);
}
async function send(){
let q=document.getElementById('userInput').value.trim();if(!q)return;
let input=document.getElementById('userInput');input.value='';
addLog('YOU ['+curTool+']',q);
addLog('VARUM AI...','Yosikiren Sir... '+curTool+' tool work pannuthu...');
try{
if(curTool==='gold'){
let r=await fetch('/api/gold');let j=await r.json();
addLog('💰 GOLD TOOL REPLY [Bottom Order #1]',JSON.stringify(j,null,2).slice(0,800));
}else{
let r=await fetch('/api/growth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,tool:curTool})});
let j=await r.json();
addLog('📈 '+curTool.toUpperCase()+' TOOL REPLY [Bottom Order]',j.gemini||JSON.stringify(j).slice(0,800));
}
addLog('✅ Tool Order','1.Growth 2.Gold 3.Finance 4.Tamil - All bottom la reply vanthirukku Sir!');
}catch(e){addLog('Error',e.message);}
}
loadHealth();
setInterval(loadHealth,15000);
</script>
</body>
</html>
