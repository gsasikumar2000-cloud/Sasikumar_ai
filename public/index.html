<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASIKUMAR AI</title>
<style>
body{background:#0a0a0a;color:#00ff88;font-family:Arial;padding:20px;margin:0}
.header{background:#111;border:2px solid #00ff88;padding:15px;border-radius:15px;text-align:center;margin-bottom:15px}
.card{background:#111;border:1px solid #00ff88;border-left:4px solid #00ff88;padding:12px;border-radius:10px;margin:10px 0;word-wrap:break-word}
.user{border-color:#ffaa00;border-left-color:#ffaa00;color:#ffaa00}
.error{border-color:#ff4444;border-left-color:#ff4444;color:#ffaaaa}
input{width:68%;padding:14px;border-radius:25px;border:2px solid #00ff88;background:#111;color:#fff;outline:none}
button{width:28%;padding:14px;border-radius:25px;border:none;background:linear-gradient(90deg,#00ff88,#00ccff);font-weight:bold}
#chat{max-height:70vh;overflow-y:auto}
</style>
</head>
<body>
<div class="header">
<h2>🤖 SASIKUMAR AI - LIVE</h2>
<div id="status">Checking...</div>
</div>
<div id="chat"></div>
<div style="display:flex;gap:5px;position:fixed;bottom:10px;left:10px;right:10px">
<input id="msg" placeholder="Type hi..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">GO ✨</button>
</div>
<script>
let category='growth';
async function check(){
 try{
  let r=await fetch('/health');
  let j=await r.json();
  document.getElementById('status').innerHTML='🟢 LIVE | Gemini: '+(j.gemini?'✅':'❌');
 }catch(e){
  document.getElementById('status').innerHTML='🔴 Offline';
 }
}
function add(text,cls){
 let d=document.createElement('div');
 d.className='card '+cls;
 d.innerHTML=text;
 document.getElementById('chat').appendChild(d);
 window.scrollTo(0,document.body.scrollHeight);
}
async function send(){
 let m=document.getElementById('msg').value;
 if(!m) return;
 add('<b>👨 YOU → '+category.toUpperCase()+'</b><br>'+m,'user');
 document.getElementById('msg').value='';
 add('⏳ Thinking...','');
 try{
  let res=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({message:m, category:category})
  });
  let text=await res.text();
  console.log("RAW:",text);
  let data;
  try{ data=JSON.parse(text); }catch(e){ data={reply:text}; }
  document.getElementById('chat').lastChild.remove();
  add('<b>🤖 SASIKUMAR AI ['+category+']</b><br>'+(data.reply||data.error||text),'');
 }catch(e){
  document.getElementById('chat').lastChild.remove();
  add('<b>Error</b><br>'+e.message,'error');
 }
}
check();
add('<b>🤖 SASIKUMAR AI ✨ [growth]</b><br>Vanakkam! Naan Sasikumar AI. Growth, Kavithai, Kural, Ponmozhi ku ready!','');
</script>
</body>
</html>
