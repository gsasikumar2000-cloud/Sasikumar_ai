<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SASIKUMAR AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0c0f12;color:#fff}
.header{position:fixed;top:0;left:0;right:0;z-index:99;background:#111a14;border-bottom:2px solid #00ff88;padding:12px;display:flex;justify-content:space-between}
#chat{padding:70px 12px 80px;display:flex;flex-direction:column;gap:10px;min-height:100vh}
.bubble{max-width:88%;padding:12px;border-radius:16px;font-size:14px}
.user{align-self:flex-end;background:linear-gradient(90deg,#00ff88,#00ccff);color:#000;font-weight:bold}
.ai{align-self:flex-start;background:#1a221e;border:1px solid #00ff88;border-left:4px solid #00ff88;color:#eafff3}
.inputBar{position:fixed;bottom:0;left:0;right:0;padding:10px;background:#0c0f12;border-top:1px solid #00ff88;display:flex;gap:8px}
.inputBar input{flex:1;padding:13px;border-radius:25px;border:2px solid #00ff88;background:#111;color:#fff;outline:none}
.inputBar button{width:50px;height:50px;border-radius:50%;border:none;background:linear-gradient(90deg,#00ff88,#00ccff);font-weight:bold}
</style></head>
<body>
<div class="header"><div>🐼 SASIKUMAR AI</div><div id="status" style="font-size:11px;color:#00ff88">● Checking</div></div>
<div id="chat"></div>
<div class="inputBar"><input id="msg" placeholder="Kelu Sir..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">GO</button></div>
<script>
let category='panda';
async function check(){try{let r=await fetch('/health');let j=await r.json();document.getElementById('status').innerHTML='🟢 LIVE Groq:'+(j.groq?'✅':'❌')}catch(e){document.getElementById('status').innerHTML='🔴 Offline'}}
function add(t,c){let d=document.createElement('div');d.className='bubble '+c;d.innerHTML=t;document.getElementById('chat').appendChild(d);window.scrollTo(0,document.body.scrollHeight)}
async function send(){let m=document.getElementById('msg').value.trim();if(!m)return;add(m,'user');document.getElementById('msg').value='';let th=document.createElement('div');th.className='bubble ai';th.innerText='🐼 Thinking...';document.getElementById('chat').appendChild(th);try{let res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,category:category})});let data=await res.json();th.remove();add((data.reply||'Error'),'ai')}catch(e){th.remove();add('Error:'+e.message,'ai')}}
check();setTimeout(()=>{add('🤖 <b>SASIKUMAR AI [panda]</b><br>Vanakkam Sir! Panda ready!','ai')},500);
</script></body></html>
