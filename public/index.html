(function(){

<script id="SK_ALL_CARD_ICONS_SCRIPT_V1">
(function(){
  "use strict";
  if (window.__SK_ALL_CARD_ICONS_V1__) return;
  window.__SK_ALL_CARD_ICONS_V1__ = true;

  function addIconButton(card, label, icon, action) {
    if (!card || card.querySelector('[data-sk-icon-action="' + action + '"]')) return;
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'sk-card-icon-btn';
    button.dataset.skIconAction = action;
    button.innerHTML = '<span aria-hidden="true">' + icon + '</span><span>' + label + '</span>';
    button.addEventListener('click', function(event) {
      event.preventDefault();
      event.stopPropagation();
      if (action === 'gold' && typeof window.liveGoldRate === 'function') window.liveGoldRate();
      else if (action === 'expert' && typeof window.goldExpert === 'function') window.goldExpert();
      else if (action === 'hallmark' && typeof window.goldHallmark === 'function') window.goldHallmark();
      else if (action === 'jobs' && typeof window.openJobsFolder === 'function') window.openJobsFolder();
      else if (action === 'education' && typeof window.openEducationFolder === 'function') window.openEducationFolder();
      else if (action === 'wallet' && typeof window.skOpenPay2AllV1 === 'function') window.skOpenPay2AllV1();
      else if (action === 'reply') {
        var input = document.getElementById('q');
        if (input) { input.focus(); input.scrollIntoView({behavior:'smooth',block:'center'}); }
      } else if (action === 'search') {
        var search = document.getElementById('skGlobalSearchTopInput') || document.getElementById('sasikumar-global-search');
        if (search) { search.focus(); search.scrollIntoView({behavior:'smooth',block:'center'}); }
      } else {
        card.scrollIntoView({behavior:'smooth',block:'center'});
      }
    });
    var heading = card.querySelector('h2,h3,h4,.skPay2AllCardHeading');
    if (heading && heading.parentNode) heading.parentNode.insertBefore(button, heading.nextSibling);
    else card.insertBefore(button, card.firstChild);
  }

  function install() {
    addIconButton(document.getElementById('skReplyCreatorCards'), 'AI Creator', '🎨', 'reply');
    addIconButton(document.getElementById('skLiveNewsBookCard'), 'News', '📰', 'news');
    addIconButton(document.getElementById('skLiveSportsBookCard'), 'Sports', '🏏', 'sports');
    addIconButton(document.getElementById('dailyThirukkural'), 'Thirukkural', '📖', 'thirukkural');
    addIconButton(document.getElementById('livePonmozhigal'), 'Ponmozhigal', '💬', 'quotes');
    addIconButton(document.getElementById('skLiveKavithaiBookCard'), 'Kavithai', '✍️', 'poem');
    addIconButton(document.getElementById('skYouTubeCreativeCards'), 'YouTube Videos', '▶️', 'videos');
    addIconButton(document.getElementById('banking-products'), 'Banking Services', '🏦', 'banking');
    addIconButton(document.getElementById('sasikumarPay2AllWallet'), 'Wallet Services', '💳', 'wallet');
    addIconButton(document.getElementById('skGoldApp'), 'Gold Rate', '🥇', 'gold');
    addIconButton(document.getElementById('allJobs'), 'Jobs', '💼', 'jobs');
    addIconButton(document.getElementById('sasikumarEducationPanel'), 'Education', '🎓', 'education');

    var appraiser = document.getElementById('skGoldApp');
    if (appraiser) {
      addIconButton(appraiser, 'Gold Expert', '💎', 'expert');
      addIconButton(appraiser, 'Hallmark', '✅', 'hallmark');
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install);
  else install();
})();
</script>
