<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SASIKUMAR AI - Animation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:Arial;padding-bottom:180px;overflow-x:hidden}
@keyframes glow{0%{box-shadow:0 0 5px #00ff88}50%{box-shadow:0 0 20px #00ff88,0 0 30px #00d4ff}100%{box-shadow:0 0 5px #00ff88}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes type{from{width:0}to{width:100%}}
@keyframes blink{50%{border-color:transparent}}
.top{background:linear-gradient(90deg,#111,#222);border-bottom:2px solid #00ff88;padding:10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;animation:slideUp .6s ease}
.avatar{width:48px;height:48px;background:linear-gradient(135deg,#00ff88,#00d4ff);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;animation:float 3s infinite, glow 2s infinite}
.title{font-size:28px;font-weight:900;text-align:center;margin:15px 0;background:linear-gradient(90deg,#00ff88,#00d4ff,#00ff88);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow 2s infinite; background-clip:text}
.reply-row{display:flex;gap:8px;margin:12px 0;animation:slideUp .8s ease}
.reply-row input{flex:1;background:#1a1a1a;border:2px solid #00ff88;border-radius:12px;padding:12px;color:#fff;transition:.3s}
.reply-row input:focus{box-shadow:0 0 15px #00ff88;transform:scale(1.02)}
.btn{background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000;border:none;border-radius:12px;padding:12px 20px;font-weight:900;cursor:pointer;animation:pulse 2s infinite;transition:.3s}
.btn:active{transform:scale(0.9)}
.tools{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding:5px}
.tool{background:#1a1a1a;border:1px solid #333;border-radius:20px;padding:8px 14px;font-size:12px;white-space:nowrap;cursor:pointer;transition:.3s}
.tool:hover{transform:translateY(-3px);border-color:#00ff88}
.tool.active{background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000;font-weight:900;animation:glow 1.5s infinite}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.card{background:#111;border:1px solid #222;border-radius:14px;padding:12px;min-height:120px;animation:slideUp .6s ease;transition:.4s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,#00ff8830,transparent);transform:rotate(45deg) translateX(-100%);transition:.6s}
.card:hover::before{transform:rotate(45deg) translateX(100%)}
.card:hover{transform:translateY(-5px) scale(1.02);border-color:#00ff88;box-shadow:0 10px 25px #00ff8830}
.card.live{border-color:#00ff88}
.card b{color:#00ff88;font-size:11px;display:block;margin-bottom:6px;animation:float 3s infinite}
.card p{font-size:12px;line-height:1.5}
.time{font-size:9px;color:#555;position:absolute;bottom:6px;right:8px}
.log{background:#111;border-left:4px solid #00ff88;border-radius:8px;padding:10px;margin:8px 0;font-size:12px;white-space:pre-wrap;animation:slideUp .4s ease;transition:.3s}
.log:hover{transform:translateX(5px)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,15,.95);backdrop-filter:blur(10px);border-top:2px solid #00ff88;padding:10px;z-index:20;animation:slideUp .8s ease}
.bottom-inner{max-width:950px;margin:0 auto;display:flex;gap:8px}
.bottom-inner input{flex:1;background:#222;border:1px solid #444;border-radius:25px;padding:12px 16px;color:#fff;transition:.3s}
.bottom-inner input:focus{border-color:#00ff88;box-shadow:0 0 12px #00ff88}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.particle{position:absolute;width:3px;height:3px;background:#00ff88;border-radius:50%;animation:float 6s infinite linear}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="top">
<div style="display:flex;align-items:center;gap:10px"><div class="avatar">👨</div><div><b>SASIKUMAR AI</b><br><small style="color:#00ff88" id="dt">Loading...</small></div></div>
<div style="color:#00ff88;font-size:12px;animation:pulse 1.5s infinite">● LIVE ANIMATED</div>
</div>
<div style="max-width:950px;margin:0 auto;padding:10px">
<div class="title">✨ SASIKUMAR AI ✨</div>
<div class="reply-row"><input id="q" placeholder="✨ Type pannunga... Magic reply varum!" onkeypress="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">GO 🚀</button></div>
<div class="tools">
<div class="tool active" data-t="growth" onclick="setTool('growth')">📈 Growth</div>
<div class="tool" data-t="gold" onclick="setTool('gold')">💰 Gold</div>
<div class="tool" data-t="news" onclick="setTool('news')">📰 News</div>
<div class="tool" data-t="ponmozhigal" onclick="setTool('ponmozhigal')">💎 Ponmozhi</div>
<div class="tool" data-t="kavithai" onclick="setTool('kavithai')">❤️ Kavithai</div>
<div class="tool" data-t="thirukkural" onclick="setTool('thirukkural')">📜 Kural</div>
</div>
<div class="cards">
<div class="card live"><b>💰 LIVE GOLD</b><p id="t-gold">✨ Loading gold...</p><span class="time" id="time-gold"></span></div>
<div class="card live"><b>📰 NEWS</b><p id="t-news">✨ Loading news...</p><span class="time" id="time-news"></span></div>
<div class="card live"><b>💎 PONMOZHIGAL</b><p id="t-pon">✨ Loading...</p><span class="time" id="time-pon"></span></div>
<div class="card live"><b>❤️ KAVITHAI</b><p id="t-kav">✨ Loading...</p><span class="time" id="time-kav"></span></div>
<div class="card live" style="grid-column:span 2"><b>📜 THIRUKKURAL</b><p id="t-thiru">✨ Loading kural...</p><span class="time" id="time-thiru"></span></div>
</div>
<div id="logs"></div>
</div>
<div class="bottom"><div class="bottom-inner"><input id="bq" placeholder="💬 Bottom animation card... GO!" onkeypress="if(event.key==='Enter')ask()"><button class="btn" style="border-radius:25px" onclick="ask()">GO ✨</button><span id="count" style="font-size:10px;color:#555;align-self:center">5:00</span></div></div>
<script>
let tool='growth';
function setTool(t){tool=t;document.querySelectorAll('.tool').forEach(e=>e.classList.remove('active'));document.querySelector(`[data-t="${t}"]`).classList.add('active');}
function updateDT(){document.getElementById('dt').innerText=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour12:true});}
setInterval(updateDT,1000);updateDT();
function addLog(h,m){let d=document.createElement('div');d.className='log';d.innerHTML='<b>'+h+'</b>\n'+m;document.getElementById('logs').appendChild(d);d.scrollIntoView({behavior:'smooth'});}
async function fetchCard(url,txtId,timeId){
try{let r=await fetch(url);let j=await r.json();let el=document.getElementById(txtId);el.style.opacity=0;setTimeout(()=>{el.innerText=j.text||j.gemini||'Loaded';el.style.opacity=1;el.style.transition='1s';},300);document.getElementById(timeId).innerText=j.time||new Date().toLocaleTimeString();}catch(e){document.getElementById(txtId).innerText='Demo mode';}
}
function loadAll(){
fetchCard('/api/gold','t-gold','time-gold');
fetchCard('/api/news','t-news','time-news');
fetchCard('/api/ponmozhi','t-pon','time-pon');
fetchCard('/api/kavithai','t-kav','time-kav');
fetchCard('/api/thirukkural','t-thiru','time-thiru');
addLog('🔄 Animated Auto','✨ All cards animated update - '+new Date().toLocaleTimeString());
}
async function ask(){
let q=document.getElementById('q').value||document.getElementById('bq').value;if(!q)return;
document.getElementById('q').value='';document.getElementById('bq').value='';
addLog('👨 YOU → '+tool.toUpperCase(),q);
let anim=document.createElement('div');anim.className='log';anim.innerHTML='⏳ <i>Varum AI yosikiren...</i> ✨';anim.style.background='linear-gradient(90deg,#111,#00ff8820)';document.getElementById('logs').appendChild(anim);
try{
let url=tool==='gold'?'/api/gold':tool==='news'?'/api/news':tool==='ponmozhigal'?'/api/ponmozhi':tool==='kavithai'?'/api/kavithai':tool==='thirukkural'?'/api/thirukkural':'/api/growth';
let opts=tool==='growth'?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,tool})}:{};
let r=await fetch(url,opts);let j=await r.json();anim.remove();
addLog('🤖 SASIKUMAR AI ✨ ['+tool+']',j.text||j.gemini||JSON.stringify(j).slice(0,500));
}catch(e){anim.remove();addLog('Error',e.message);}
}
function createParticles(){
let c=document.getElementById('particles');
for(let i=0;i<20;i++){let p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.top=Math.random()*100+'%';p.style.animationDelay=Math.random()*6+'s';p.style.animationDuration=(4+Math.random()*4)+'s';c.appendChild(p);}
}
createParticles();
loadAll();setInterval(loadAll,300000);
let s=300;setInterval(()=>{s--;if(s<=0)s=300;document.getElementById('count').innerText=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},1000);
</script>
</body>
</html>
