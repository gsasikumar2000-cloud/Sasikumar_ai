<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SASIKUMAR AI - Mobile Recharge</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#e8fff1,#eef7ff);margin:0;padding:20px}
.card{max-width:520px;margin:30px auto;background:#fff;padding:24px;border-radius:22px;box-shadow:0 10px 35px #0002}
h1{text-align:center;color:#008f45;margin-bottom:5px}
h2{text-align:center;margin-top:5px}
label{display:block;margin-top:14px;font-weight:bold}
input,select,button{width:100%;padding:13px;margin-top:7px;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}
button{background:linear-gradient(135deg,#00c853,#008f45);color:#fff;border:0;font-weight:bold;margin-top:20px;cursor:pointer}
button:disabled{opacity:.6}
#result{margin-top:18px;padding:12px;border-radius:10px;background:#f1f1f1;white-space:pre-wrap}
.status{text-align:center;font-size:13px;margin-top:10px}
</style>
</head>
<body>

<!-- SASIKUMAR AI BRAND HEADER -->
<div id="skGlobalBrandHeader" style="box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:9px 14px;margin:0 0 12px;background:linear-gradient(110deg,#071b38,#123f65,#075b55);color:#fff;border-bottom:2px solid #d8b54a;font-family:Arial,sans-serif;position:relative;z-index:5;">
  <img src="/assets/sasikumar-ai-logo.png?v=20261010" alt="SASIKUMAR AI"
       style="display:block;width:42px;height:42px;min-width:42px;object-fit:contain;cursor:pointer;transition:transform .5s ease;"
       onclick="this.style.transform='rotate(360deg)';setTimeout(()=>this.style.transform='',550)">
  <div style="min-width:0;">
    <div style="font-size:16px;font-weight:800;letter-spacing:.5px;line-height:1.35;">SASIKUMAR AI</div>
    <div style="font-size:11px;opacity:.88;line-height:1.4;">Smart Digital Services</div>
  </div>
</div>
<!-- END SASIKUMAR AI BRAND HEADER -->

<div class="card">
<h1>📱 SASIKUMAR AI</h1>
<h2>Mobile Recharge</h2>

<div id="apiStatus" class="status">Checking Pay2All...</div>

<label>Mobile Number</label>
<div style="display:flex;gap:10px;margin:12px 0;">
<label style="flex:1;padding:12px;border-radius:14px;background:#e8f7ff;text-align:center;font-weight:800;">
<input type="radio" name="rechargeMode" id="rechargeMode" value="prepaid" checked> 🔵 Prepaid
</label>
<label style="flex:1;padding:12px;border-radius:14px;background:#f3edff;text-align:center;font-weight:800;">
<input type="radio" name="rechargeMode" value="postpaid"> 🟣 Postpaid
</label>
</div>
<input id="number" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number">

<label>Operator</label>
<select id="provider">
<option value="">Loading operators...</option>
</select>

<label>Amount ₹</label>
<input id="amount" type="number" min="1" placeholder="Recharge amount">

<button id="rechargeBtn" onclick="recharge()">RECHARGE</button>
<div id="result">Recharge system ready.</div>
</div>

<script>
async function loadProviders(){
  const select=document.getElementById("provider");

  try{
    const response=await fetch("/api/recharge/providers");
    const data=await response.json();

    const providers=(data.data||[]);

    select.innerHTML="";

    providers.forEach(p=>{
      const option=document.createElement("option");
      option.value=p.provider_id;
      option.textContent=p.name;
      select.appendChild(option);
    });

    if(!providers.length){
      select.innerHTML='<option value="">No operators available</option>';
    }
  }catch(error){
    select.innerHTML='<option value="">Unable to load operators</option>';
  }
}

async function loadConfig(){
  const status=document.getElementById("apiStatus");
  try{
    const r=await fetch("/api/recharge/config");
    const d=await r.json();
    status.textContent=d.enabled
      ? "🟢 Pay2All API Connected • UAT/Sandbox"
      : "🔴 Pay2All API Not Configured";
  }catch(e){
    status.textContent="🔴 Recharge API unavailable";
  }
}

async function recharge(){
  const number=document.getElementById("number").value.trim();
  const provider_id=document.getElementById("provider").value;
  const amount=Number(document.getElementById("amount").value);
  const result=document.getElementById("result");
  const btn=document.getElementById("rechargeBtn");

  if(!/^[6-9]\d{9}$/.test(number)){
    result.textContent="Enter a valid 10-digit mobile number.";
    return;
  }

  if(!amount || amount<1){
    result.textContent="Enter a valid recharge amount.";
    return;
  }

  const client_id="SKAI-"+Date.now();

  btn.disabled=true;
  result.textContent="Checking recharge service...";

  try{
    const config=await fetch("/api/recharge/config").then(r=>r.json());

    if(!config.enabled){
      result.textContent="Pay2All API is not configured.";
      return;
    }

    if(!config.live){
      result.textContent=
        "✅ Pay2All API connected.\n\n"+
        "🟡 LIVE recharge is not activated yet.\n"+
        "Current mode: UAT/Sandbox.\n"+
        "No real recharge was submitted.";
      return;
    }

    const response=await fetch("/api/recharge/order",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        client_id,
        provider_id:Number(provider_id),
        number,
        amount
      })
    });

    const data=await response.json();
    result.textContent=JSON.stringify(data,null,2);

  }catch(error){
    result.textContent="Recharge service connection failed.";
  }finally{
    btn.disabled=false;
  }
}

loadProviders();
loadConfig();
</script>

<script>
function updateRechargeMode(){
  const mode=document.querySelector('input[name="rechargeMode"]:checked')?.value || "prepaid";
  const btn=document.getElementById("rechargeBtn");
  if(btn) btn.textContent = mode==="postpaid" ? "PAY BILL" : "RECHARGE";
}
document.querySelectorAll('input[name="rechargeMode"]').forEach(el=>{
  el.addEventListener("change",updateRechargeMode);
});
</script>
</body>
</html>
