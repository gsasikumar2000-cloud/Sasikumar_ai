<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Seeker Registration - SASIKUMAR AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e5f4ff,#fff0fa,#fff9df);color:#183047}
header{padding:20px;text-align:center;background:linear-gradient(110deg,#075985,#2563eb,#9333ea);color:white}
header img{width:65px;height:65px;object-fit:contain}
main{max-width:650px;margin:20px auto;padding:14px}
.card{background:#ffffffed;border-radius:20px;padding:20px;box-shadow:0 8px 25px #3454a333}
label{display:block;font-weight:bold;margin-top:14px}
input,select,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #b7c9dd;border-radius:10px;font-size:16px}
button,.back{display:block;width:100%;padding:14px;margin-top:18px;border:0;border-radius:12px;background:#0878f9;color:white;font-size:16px;font-weight:bold;text-align:center;text-decoration:none}
.note{font-size:13px;line-height:1.6;color:#555}
</style>
</head>
<body>
<header>
<img src="/assets/sasikumar-ai-logo.png" alt="SASIKUMAR AI">
<h1>💼 Job Seeker Registration</h1>
<p>SASIKUMAR AI — Jobs & Careers</p>
</header>
<main>
<div class="card">
<h2>📝 Candidate Details</h2>
<form id="jobForm">
<label for="name">Full Name *</label>
<input id="name" name="name" required maxlength="100" autocomplete="name">

<label for="mobile">Mobile Number *</label>
<input id="mobile" name="mobile" type="tel" required maxlength="20" autocomplete="tel">

<label for="email">Email</label>
<input id="email" name="email" type="email" maxlength="150" autocomplete="email">

<label for="location">District / Location *</label>
<input id="location" name="location" required maxlength="100">

<label for="education">Educational Qualification *</label>
<select id="education" name="education" required>
<option value="">Select qualification</option>
<option>10th</option><option>12th</option><option>ITI</option>
<option>Diploma</option><option>UG Degree</option>
<option>PG Degree</option><option>Engineering</option>
<option>Other</option>
</select>

<label for="experience">Work Experience</label>
<select id="experience" name="experience">
<option>Fresher</option><option>Less than 1 year</option>
<option>1–3 years</option><option>3–5 years</option>
<option>More than 5 years</option>
</select>

<label for="jobtype">Preferred Job Type *</label>
<select id="jobtype" name="jobtype" required>
<option value="">Select job type</option>
<option>Private Job</option><option>Government Job</option>
<option>Full Time</option><option>Part Time</option>
<option>Work From Home</option><option>Internship</option>
</select>

<label for="skills">Skills / Preferred Job</label>
<textarea id="skills" name="skills" rows="3" maxlength="1000"></textarea>

<p class="note">
Privacy: Enter only information you are comfortable sharing.
This form currently prepares a message on your device. It does not
upload or permanently save your details to SASIKUMAR AI.
</p>

<button type="submit">📲 Prepare Registration Message</button>
</form>
<p id="result" class="note" role="status"></p>
<a class="back" href="index.html">⬅ Back to Jobs</a>
</div>
</main>
<script>
document.getElementById('jobForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const f = new FormData(this);
  const message = [
    '💼 SASIKUMAR AI — JOB SEEKER REGISTRATION',
    '',
    'Name: ' + f.get('name'),
    'Mobile: ' + f.get('mobile'),
    'Email: ' + (f.get('email') || 'Not provided'),
    'Location: ' + f.get('location'),
    'Qualification: ' + f.get('education'),
    'Experience: ' + f.get('experience'),
    'Preferred Job: ' + f.get('jobtype'),
    'Skills / Job Preference: ' + (f.get('skills') || 'Not provided'),
    '',
    'This is a candidate-submitted draft. Please confirm receipt before treating it as registered.'
  ].join('\n');

  try {
    if (navigator.share) {
      await navigator.share({title:'Job Seeker Registration',text:message});
      document.getElementById('result').textContent =
        'Share window opened. Select a recipient to send your details. This page does not store your registration.';
    } else {
      await navigator.clipboard.writeText(message);
      document.getElementById('result').textContent =
        'Registration message copied. Paste it into WhatsApp or another messaging app. Details have not been saved on the server.';
    }
  } catch (err) {
    document.getElementById('result').textContent =
      'Sharing was cancelled or unavailable. Your details have not been sent or saved.';
  }
});
</script>
</body>
</html>
