<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Railway Jobs - SASIKUMAR AI</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:20px;text-align:center}
main{max-width:700px;margin:auto;padding:16px}
.card{background:#fff;padding:18px;margin:14px 0;border-radius:16px;box-shadow:0 2px 8px #ccc}
</style>
<style id="sasikumar-railway-3d">
body{
  font-family:Arial,sans-serif!important;
  background:
    radial-gradient(circle at 8% 18%,rgba(0,190,255,.28),transparent 30%),
    radial-gradient(circle at 92% 20%,rgba(255,0,180,.22),transparent 30%),
    radial-gradient(circle at 50% 90%,rgba(255,190,0,.22),transparent 35%),
    linear-gradient(135deg,#eef8ff,#fff1fa,#fffbea)!important;
  background-size:180% 180%;
  animation:railwayBg 12s ease infinite;
}
@keyframes railwayBg{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
header{
  position:relative;
  overflow:hidden;
  background:linear-gradient(120deg,#0066ff,#6a00ff,#ff1493,#ff9800)!important;
  background-size:250% 250%;
  animation:railwayHeader 7s ease infinite;
  padding:28px 20px!important;
  box-shadow:0 12px 30px rgba(50,40,120,.25);
}
header::after{
  content:"";
  position:absolute;
  width:180px;height:180px;
  right:-70px;top:-90px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
}
@keyframes railwayHeader{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
main{max-width:700px!important;padding:20px 16px!important}
.card{
  position:relative;
  overflow:hidden;
  background:rgba(255,255,255,.74)!important;
  border:1px solid rgba(255,255,255,.85);
  border-radius:24px!important;
  box-shadow:0 14px 35px rgba(35,55,110,.16),
             inset 0 1px 0 rgba(255,255,255,.9)!important;
  backdrop-filter:blur(14px);
  transition:transform .3s ease,box-shadow .3s ease;
}
.card::before{
  content:"";
  position:absolute;
  width:110px;height:110px;
  right:-45px;top:-45px;
  border-radius:50%;
  background:linear-gradient(135deg,#00c6ff,#ff3cac);
  opacity:.17;
}
.card:hover{
  transform:translateY(-8px) rotateX(2deg) scale(1.015);
  box-shadow:0 24px 50px rgba(35,55,110,.25);
}
.card h2{
  background:linear-gradient(90deg,#0066ff,#9b00ff,#ff1493);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.card a{
  display:inline-block;
  padding:11px 18px;
  border-radius:14px;
  color:#fff!important;
  background:linear-gradient(135deg,#0066ff,#9b00ff,#ff1493);
  text-decoration:none;
  font-weight:700;
  box-shadow:0 8px 18px rgba(90,40,200,.22);
  transition:transform .2s ease,box-shadow .2s ease;
}
.card a:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 24px rgba(90,40,200,.3);
}
@media(max-width:600px){
  .card{border-radius:19px!important}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

</head>
<body>
<header><h1>🚆 Railway Jobs</h1><p>SASIKUMAR AI</p></header>
<main>
<div class="card"><h2>🚆 Railway Recruitment</h2>
<p>RRB recruitment • Technical • Non-Technical • Apprentice opportunities</p>
<p>Verify the official Railway/RRB notification before submitting an application.</p>
</div>
<div class="card"><h2>📝 Application</h2><a href="apply.html">View Job Apply Details →</a></div>
</main>
</body></html>
