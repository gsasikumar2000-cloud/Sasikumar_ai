<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Loan RD FD EMI</title>
<style>body{font-family:system-ui;background:#f0f9ff;margin:0;padding:12px;} .card{border:3px solid #0f172a;border-radius:16px;padding:14px;background:#fff;margin:10px auto;max-width:500px;} .bold{color:#000!important;font-weight:900!important;} input{width:100%;padding:10px;border:2px solid #000;border-radius:10px;margin:6px 0;font-weight:700;} .btn{background:#0f172a;color:#FFD700;border:2px solid #FFD700;border-radius:12px;padding:10px;font-weight:900;width:100%;cursor:pointer;} .result{background:#000;color:#FFD700;padding:12px;border-radius:10px;margin-top:10px;font-weight:900;text-align:center;}</style>
</head><body>
<h2 class="bold" style="text-align:center;">🧮 LOAN RD FD EMI ALL</h2>
<div class="card"><div class="bold">EMI</div><input id="loanAmt" type="number" value="500000"><input id="loanRate" type="number" value="8.5"><input id="loanTenure" type="number" value="60"><button class="btn" onclick="calcEMI()">Calculate EMI</button><div class="result" id="emiRes">EMI: ₹0</div></div>
<div class="card"><div class="bold">RD</div><input id="rdAmt" type="number" value="5000"><input id="rdRate" type="number" value="6.5"><input id="rdMonths" type="number" value="60"><button class="btn" onclick="calcRD()">Calculate RD</button><div class="result" id="rdRes">Maturity: ₹0</div></div>
<div class="card"><div class="bold">FD</div><input id="fdAmt" type="number" value="100000"><input id="fdRate" type="number" value="7"><input id="fdYears" type="number" value="5"><button class="btn" onclick="calcFD()">Calculate FD</button><div class="result" id="fdRes">Maturity: ₹0</div></div>
<script>function calcEMI(){let P=+loanAmt.value,r=+loanRate.value/12/100,n=+loanTenure.value;let emi=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);let tot=emi*n;emiRes.innerHTML=`EMI: ₹${emi.toFixed(0)}<br>Total: ₹${tot.toFixed(0)}<br>Interest: ₹${(tot-P).toFixed(0)}`;}function calcRD(){let m=+rdAmt.value,rate=+rdRate.value/100/12,n=+rdMonths.value;let mat=0;for(let i=0;i<n;i++) mat+=m*Math.pow(1+rate,n-i);let dep=m*n;rdRes.innerHTML=`Maturity: ₹${mat.toFixed(0)}<br>Interest: ₹${(mat-dep).toFixed(0)}`;}function calcFD(){let p=+fdAmt.value,r=+fdRate.value/100,n=+fdYears.value;let mat=p*Math.pow(1+r,n);fdRes.innerHTML=`Maturity: ₹${mat.toFixed(0)}<br>Interest: ₹${(mat-p).toFixed(0)}`;}calcEMI();calcRD();calcFD();</script>
</body></html>
