<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SASIKUMAR AI</title><style>body{font-family:Arial;margin:0;background:#111;color:#fff}header{padding:18px;text-align:center;background:#222}#chat{height:65vh;overflow:auto;padding:15px}.msg{padding:12px;margin:8px 0;border-radius:10px;background:#222}.user{background:#333}footer{display:flex;padding:10px;gap:8px;position:fixed;bottom:0;width:100%;box-sizing:border-box;background:#111}input{flex:1;padding:14px;border-radius:8px;border:0}button{padding:14px;border:0;border-radius:8px} </style></head><body><header><h2>SASIKUMAR AI</h2><small>Server Connected ✅</small></header><div id="chat"><div class="msg">🤖 வணக்கம்! நான் SASIKUMAR AI. கேள்வி கேளுங்கள்.</div></div><footer><input id="q" placeholder="உங்கள் கேள்வியை எழுதுங்கள்..."><button onclick="send()">Send</button></footer><script>async function send(){let q=document.getElementById("q"),v=q.value.trim();if(!v)return;let c=document.getElementById("chat");c.innerHTML+=`<div class="msg user">👤 ${v}</div>`;q.value="";c.innerHTML+=`<div class="msg" id="loading">🤖 பதில் எழுதுகிறது...</div>`;c.scrollTop=c.scrollHeight;try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:v})});let d=await r.json();document.getElementById("loading").outerHTML=`<div class="msg">🤖 ${d.reply||d.error||"பதில் கிடைக்கவில்லை."}</div>`}catch(e){document.getElementById("loading").outerHTML=`<div class="msg">❌ Server error</div>`}c.scrollTop=c.scrollHeight}document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")send()})</script></body></html>
