<script>
function openCamera(){document.getElementById("cameraInput").click();}
function openUpload(){
  const input = document.getElementById("uploadInput");
  if (!input) {
    alert("Image upload input not found. Please refresh the page.");
    return;
  }

  // Open Android's file picker directly from the Upload button.
  input.value = "";
  try {
    input.click();
  } catch (err) {
    console.error("Image upload error:", err);
    input.removeAttribute("hidden");
    input.style.display = "block";
    input.style.position = "fixed";
    input.style.left = "10px";
    input.style.bottom = "10px";
    input.style.zIndex = "99999";
    input.style.opacity = "1";
    input.style.width = "90%";
    input.style.height = "48px";
    alert("Tap the file selection control to choose an image.");
  }
}
function selectPrompt(){const e=document.getElementById("prompt");e.focus();e.select();}

function showSelectedImage(input){
 const file=input.files&&input.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=function(e){
   const r=document.getElementById("result");
   r.innerHTML="";
   const img=document.createElement("img");
   img.src=e.target.result;
   img.alt="Selected image preview";
   r.appendChild(img);
   document.getElementById("status").textContent="✅ Image preview ready.";
 };
 reader.readAsDataURL(file);
}

async function pasteImage(){
 try{
   const items=await navigator.clipboard.read();
   for(const item of items){
     const type=item.types.find(t=>t.startsWith("image/"));
     if(type){
       const blob=await item.getType(type);
       const r=document.getElementById("result");
       r.innerHTML="";
       const img=document.createElement("img");
       img.src=URL.createObjectURL(blob);
       img.alt="Pasted image preview";
       r.appendChild(img);
       document.getElementById("status").textContent="✅ Image pasted.";
       return;
     }
   }
   alert("No image found in clipboard.");
 }catch(e){
   alert("📋 Image paste permission unavailable. Please use Upload.");
 }
}

async function sharePrompt(){
  const text=document.getElementById("prompt").value.trim();
  if(!text){alert("Enter image description first.");return;}
  if(navigator.share){
    try{await navigator.share({title:"SASIKUMAR AI Image Maker",text});}
    catch(e){}
  }else{
    await navigator.clipboard.writeText(text);
    alert("Copied. You can share it now.");
  }
}
async function copyPrompt(){
  const el=document.getElementById("prompt");
  if(!el.value){alert("Enter image description first.");return;}
  await navigator.clipboard.writeText(el.value);
  alert("✅ Copied");
}
async function cutPrompt(){
  const el=document.getElementById("prompt");
  if(!el.value){alert("Enter image description first.");return;}
  await navigator.clipboard.writeText(el.value);
  el.value="";
  alert("✂️ Cut");
}
async function pastePrompt(){
  const el=document.getElementById("prompt");
  try{
    el.value=await navigator.clipboard.readText();
    el.focus();
  }catch(e){
    alert("📥 Paste permission is unavailable. Please paste manually.");
  }
}


/* SK_LOCAL_POSTER_PNG_V1 */
let skLocalPosterUrl = '';
let skGeneratedImageUrl = '';

function skEscapeXml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&apos;'
  })[ch]);
}

function skWrapPosterText(value, maxChars) {
  const words = String(value).split(/\s+/);
  const lines = [];
  let line = '';

  for (const word of words) {
    if (!word) continue;

    if ((line + ' ' + word).trim().length > maxChars && line) {
      lines.push(line);
      line = word;
    } else {
      line = (line + ' ' + word).trim();
    }
  }

  if (line) lines.push(line);
  return lines.slice(0, 12);
}

function createLocalPoster(prompt) {
  const text = String(prompt || '').trim();
  if (!text) throw new Error('Please enter poster content first.');

  const typeEl = document.getElementById('skPosterType');
  const type = typeEl ? typeEl.value : 'general';

  const themes = {
    business: {
      title: 'BUSINESS PROMOTION',
      c1: '#064e3b', c2: '#16a34a', accent: '#fde047'
    },
    birthday: {
      title: 'HAPPY BIRTHDAY',
      c1: '#831843', c2: '#9333ea', accent: '#fef08a'
    },
    festival: {
      title: 'FESTIVAL WISHES',
      c1: '#9a3412', c2: '#ea580c', accent: '#fef08a'
    },
    gold: {
      title: 'GOLD RATE UPDATE',
      c1: '#713f12', c2: '#b45309', accent: '#fde047'
    },
    motivation: {
      title: 'DAILY MOTIVATION',
      c1: '#312e81', c2: '#7c3aed', accent: '#fde047'
    },
    news: {
      title: 'LATEST NEWS',
      c1: '#7f1d1d', c2: '#dc2626', accent: '#fef08a'
    },
    youtube: {
      title: 'YOUTUBE THUMBNAIL',
      c1: '#7f1d1d', c2: '#ea580c', accent: '#ffffff'
    },
    voice: {
      title: 'VOICE ANNOUNCEMENT',
      c1: '#164e63', c2: '#0f766e', accent: '#fde047'
    },
    general: {
      title: 'SPECIAL ANNOUNCEMENT',
      c1: '#075985', c2: '#6d28d9', accent: '#fde047'
    }
  };

  const theme = { ...(themes[type] || themes.general) };

  const bgPicker = document.getElementById('skPosterBg');
  const textPicker = document.getElementById('skPosterTextColor');
  const brandInput = document.getElementById('skPosterBrand');
  const footerInput = document.getElementById('skPosterFooter');

  const customBg = bgPicker ? bgPicker.value : '';
  const customText = textPicker ? textPicker.value : '#ffffff';
  const brandText = brandInput && brandInput.value.trim()
    ? brandInput.value.trim()
    : 'SASIKUMAR AI';
  const footerText = footerInput && footerInput.value.trim()
    ? footerInput.value.trim()
    : 'Smart Digital Services';

  if (/^#[0-9a-fA-F]{6}$/.test(customBg)) {
    theme.c1 = customBg;
    theme.c2 = customBg;
  }

  const lines = skWrapPosterText(text, 26);
  const safeTextColor = /^#[0-9a-fA-F]{6}$/.test(customText)
    ? customText
    : '#ffffff';
  const textSvg = lines.map((line, i) =>
    '<text x="540" y="' + (520 + i * 62) +
    '" text-anchor="middle" font-family="Arial,sans-serif" ' +
    'font-size="34" fill="' + safeTextColor + '">' +
    skEscapeXml(line) + '</text>'
  ).join('');

  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">' +
    '<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="' + theme.c1 + '"/>' +
    '<stop offset="1" stop-color="' + theme.c2 + '"/>' +
    '</linearGradient></defs>' +
    '<rect width="1080" height="1350" rx="42" fill="url(#bg)"/>' +
    '<circle cx="80" cy="100" r="170" fill="#ffffff" opacity=".07"/>' +
    '<circle cx="1000" cy="1200" r="220" fill="#ffffff" opacity=".08"/>' +
    '<rect x="32" y="32" width="1016" height="1286" rx="32" fill="none" stroke="' + theme.accent + '" stroke-width="8"/>' +
    '<rect x="95" y="95" width="890" height="185" rx="28" fill="#ffffff" opacity=".12"/>' +
    '<text x="540" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="' + theme.accent + '">' + skEscapeXml(brandText) + '</text>' +
    '<text x="540" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="bold" fill="#ffffff">' + theme.title + '</text>' +
    '<path d="M180 330 H900" stroke="' + theme.accent + '" stroke-width="5"/>' +
    textSvg +
    '<rect x="140" y="1050" width="800" height="150" rx="24" fill="#ffffff" opacity=".12"/>' +
    '<text x="540" y="1115" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="' + theme.accent + '">CREATED WITH SASIKUMAR AI</text>' +
    '<text x="540" y="1165" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#ffffff">Smart Digital Services</text>' +
    '</svg>';

  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function refreshAdvancedPoster() {

  try {

  } catch (err) {
    document.getElementById('status').textContent =
      '❌ ' + err.message;
  }
}

function thirtyChars() {
  return 30;
}

function makeLocalPoster(prompt) {
  const result = document.getElementById('result');
  const status = document.getElementById('status');

  skGeneratedImageUrl = '';
  skLocalPosterUrl = createLocalPoster(prompt);

  result.innerHTML = '';
  const img = document.createElement('img');
  img.src = skLocalPosterUrl;
  img.alt = 'SASIKUMAR AI local poster';
  result.appendChild(img);

  status.textContent =
    '✅ Local poster created. Tap Download Poster PNG to save it.';
}

async function downloadPosterPNG() {
  const status = document.getElementById('status');

  if (!skGeneratedImageUrl && !skLocalPosterUrl) {
    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) {
      status.textContent = 'Please enter a description first.';
      return;
    }
    try {
      makeLocalPoster(prompt);
    } catch (err) {
      status.textContent = '❌ Could not create poster: ' + err.message;
      return;
    }
  }

  const sourceUrl = skGeneratedImageUrl || skLocalPosterUrl;
  status.textContent = '⏳ Preparing PNG download...';

  try {
    const image = new Image();
    if (!sourceUrl.startsWith('data:') && !sourceUrl.startsWith('blob:')) {
      image.crossOrigin = 'anonymous';
    }

    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(new Error('Image could not be loaded for PNG export.'));
      image.src = sourceUrl;
    });

    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1350;
    const ctx = canvas.getContext('2d');

    if (!ctx) throw new Error('Canvas is not supported by this browser.');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const scale = Math.min(
      canvas.width / image.naturalWidth,
      canvas.height / image.naturalHeight
    );
    const width = Math.round(image.naturalWidth * scale);
    const height = Math.round(image.naturalHeight * scale);
    ctx.drawImage(
      image,
      Math.round((canvas.width - width) / 2),
      Math.round((canvas.height - height) / 2),
      width,
      height
    );

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!blob) throw new Error('PNG conversion failed.');

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'sasikumar-ai-poster.png';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);

    status.textContent = '✅ PNG download started.';
  } catch (err) {
    status.textContent =
      '❌ PNG export failed: ' + err.message +
      ' Try Local Poster if the AI image provider blocks browser export.';
  }
}
/* END SK_LOCAL_POSTER_PNG_V1 */


async function generateImage() {
  const prompt = document.getElementById('prompt').value.trim();
  const status = document.getElementById('status');
  const result = document.getElementById('result');

  result.innerHTML = '';

  if (!prompt) {
    status.textContent = 'Please enter an image description.';
    return;
  }

  status.textContent = '⏳ Trying AI image generation...';

  try {
    const response = await fetch('/api/ai/image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    const data = await response.json();

    if (data.ok && data.imageUrl) {
      skLocalPosterUrl = '';
      const img = document.createElement('img');
      img.src = data.imageUrl;
      img.alt = prompt;
      result.appendChild(img);
      status.textContent = '✅ AI image generated successfully.';
      return;
    }

    status.textContent =
      'ℹ️ AI image unavailable. Creating a local poster instead...';
    makeLocalPoster(prompt);

  } catch (error) {
    status.textContent =
      'ℹ️ AI image service unavailable. Creating a local poster instead...';

    try {
      makeLocalPoster(prompt);
    } catch (localError) {
      status.textContent = '❌ ' + localError.message;
    }
  }
}

// SK_HUGGINGFACE_IMAGE_UI_V1
async function generateImageWithHF() {
  const prompt = document.getElementById('prompt').value.trim();
  const status = document.getElementById('status');
  const result = document.getElementById('result');

  result.innerHTML = '';

  if (!prompt) {
    status.textContent = 'Please enter an image description.';
    return;
  }

  status.textContent = '⏳ Generating image with Hugging Face...';

  try {
    const response = await fetch('/api/ai/image/huggingface', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    const data = await response.json();

    if (!response.ok || !data.ok || !data.imageUrl) {
      throw new Error(data.error || `Request failed (${response.status})`);
    }

async function generateImageAuto() {
  const prompt = document.getElementById('prompt').value.trim();
  const status = document.getElementById('status');
  const result = document.getElementById('result');

  result.innerHTML = '';

  if (!prompt) {
    status.textContent = '⚠️ Please enter an image description.';
    return;
  }

  const providers = [
    { name: 'Gemini AI', url: '/api/ai/image' },
    { name: 'Hugging Face', url: '/api/ai/image/huggingface' },
    { name: 'Stability AI', url: '/api/ai/image/stability' },
    { name: 'Cloudflare FLUX 3', url: '/api/ai/image/cloudflare' }
  ];

  const failures = [];

  for (const provider of providers) {
    status.textContent = '⏳ Trying ' + provider.name + '...';

    try {
      const response = await fetch(provider.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });

      const data = await response.json();

      if (!response.ok || !data.ok || !data.imageUrl) {
        throw new Error(data.error || 'HTTP ' + response.status);
      }

      const img = new Image();
      img.alt = prompt;
      img.style.maxWidth = '100%';
      img.style.height = 'auto';

      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error('Image preview failed'));
        img.src = data.imageUrl;
      });

      skGeneratedImageUrl = data.imageUrl;
      skLocalPosterUrl = '';
      result.appendChild(img);
      status.textContent = '✅ Image generated successfully with ' + provider.name + '!';
      return;

    } catch (error) {
      failures.push(provider.name + ': ' + error.message);
      status.textContent = '⚠️ ' + provider.name + ' failed. Trying the next provider...';
    }
  }

  console.warn('[Automatic Image Generation] All AI providers failed:', failures);

  try {
    makeLocalPoster(prompt);
    status.textContent = '🎨 AI providers unavailable. Local Poster fallback displayed.';
  } catch (error) {
    status.textContent = '❌ AI providers failed and Local Poster could not be created: ' + error.message;
  }
}

<script id="sk_all_logo_spin_v2-script">
(function () {
  function spinLogo(img) {
    if (!img || !/sasikumar-ai-logo\.png/i.test(img.getAttribute('src') || '')) return;
    img.style.setProperty('animation', 'skAllLogoSpinV2 3s linear infinite', 'important');
  }
  function scan(root) {
    if (root.matches && root.matches('img')) spinLogo(root);
    if (root.querySelectorAll) root.querySelectorAll('img').forEach(spinLogo);
  }
  scan(document);
  new MutationObserver(function (records) {
    records.forEach(function (record) {
      if (record.type === 'attributes') spinLogo(record.target);
      else record.addedNodes.forEach(function (node) {
        if (node.nodeType === 1) scan(node);
      });
    });
  }).observe(document.documentElement, {
    subtree: true, childList: true, attributes: true, attributeFilter: ['src']
  });
})();
</script>


<script id="SK_VOICE_POSTER_MAKER_V1">
(function () {
  let recognition = null;

  const $ = id => document.getElementById(id);
  const setVoiceStatus = message => {
    const el = $("skVoiceStatus");
    if (el) el.textContent = message;
  };

  window.skStartPosterVoice = function () {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      setVoiceStatus("Voice recognition is not supported in this browser. Please use a supported browser or type your content.");
      return;
    }

    try {
      if (recognition) recognition.stop();
      recognition = new SpeechRecognition();
      recognition.lang = $("skVoiceLanguage").value || "ta-IN";
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => setVoiceStatus("🎤 Listening… Please speak now.");
      recognition.onresult = event => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        if (transcript) {
          $("prompt").value = transcript.trim();
          setVoiceStatus("Recognised: " + transcript.trim());
        }
      };
      recognition.onerror = event => setVoiceStatus("Voice error: " + event.error + ". You can type the text instead.");
      recognition.onend = () => {
        if ($("skVoiceStatus").textContent.includes("Listening")) {
          setVoiceStatus("Listening stopped. Check the poster text.");
        }
      };
      recognition.start();
    } catch (error) {
      setVoiceStatus("Could not start the microphone. Check browser microphone permission.");
    }
  };

  window.skStopPosterVoice = function () {
    if (recognition) {
      try { recognition.stop(); } catch (_) {}
    }
    setVoiceStatus("Voice listening stopped.");
  };

  window.skBuildVoicePosterText = function () {
    const heading = $("skVoiceHeading").value.trim();
    const subheading = $("skVoiceSubheading").value.trim();
    const spoken = $("prompt").value.trim();
    const parts = [];
    if (heading) parts.push(heading);
    if (subheading) parts.push(subheading);
    if (spoken && spoken !== heading && spoken !== subheading) parts.push(spoken);
    if (!parts.length) {
      setVoiceStatus("Please speak or enter a heading or poster content first.");
      return;
    }
    $("prompt").value = parts.join("\\n\\n");
    setVoiceStatus("Heading and details added to Poster Content.");
  };

  window.skSpeakPosterAnnouncement = function () {
    const text = [
      $("skVoiceHeading").value.trim(),
      $("skVoiceSubheading").value.trim(),
      $("prompt").value.trim()
    ].filter(Boolean).join(". ");

    if (!text) {
      setVoiceStatus("Enter or speak announcement text first.");
      return;
    }
    if (!("speechSynthesis" in window)) {
      setVoiceStatus("Text-to-speech is not supported in this browser.");
      return;
    }

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = $("skVoiceLanguage").value || "ta-IN";
    utterance.rate = 0.9;
    utterance.onend = () => setVoiceStatus("Announcement finished.");
    window.speechSynthesis.speak(utterance);
    setVoiceStatus("🔊 Speaking announcement…");
  };

  window.skStopPosterAnnouncement = function () {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    setVoiceStatus("Announcement stopped.");
  };

  window.skGenerateVoicePoster = function () {
    const heading = $("skVoiceHeading").value.trim();
    const subheading = $("skVoiceSubheading").value.trim();
    const current = $("prompt").value.trim();
    const content = [heading, subheading, current]
      .filter((value, index, arr) => value && arr.indexOf(value) === index)
      .join("\\n\\n");

    if (!content) {
      setVoiceStatus("Please speak or type poster content first.");
      return;
    }

    $("prompt").value = content;
    try {
      if (typeof makeLocalPoster !== "function") throw new Error("Poster generator is unavailable.");
      makeLocalPoster(content);
      setVoiceStatus("✅ Poster preview created. Use Download Poster PNG to save it.");
      $("result").scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (error) {
      setVoiceStatus("Poster error: " + error.message);
    }
  };

  window.skSharePosterWhatsApp = function () {
    const text = [
      $("skVoiceHeading").value.trim(),
      $("skVoiceSubheading").value.trim(),
      $("prompt").value.trim(),
      "Created with SASIKUMAR AI",
      window.location.origin + "/ai-image.html"
    ].filter(Boolean).join("\\n\\n");
    window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener");
  };

  window.skSharePosterFacebook = function () {
    const shareUrl = window.location.origin + "/ai-image.html";
    window.open(
      "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(shareUrl),
      "_blank",
      "noopener"
    );
  };
})();
</script>
