<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SASIKUMAR AI - Image Maker</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#020617,#111827,#312e81);color:white;min-height:100vh}
.wrap{max-width:700px;margin:auto;padding:24px 16px}
.card{background:rgba(15,23,42,.95);border-radius:22px;padding:22px}
h1{text-align:center}
textarea{width:100%;min-height:130px;box-sizing:border-box;padding:14px;border-radius:14px;background:#020617;color:white;border:1px solid #475569;font-size:16px}
.tool-title{text-align:center;margin-top:18px;font-size:18px;font-weight:bold}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tool-grid button{margin-top:0;background:#1e293b;color:white;border:1px solid #475569}
.hidden-file{display:none}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;font-size:16px;font-weight:bold}
.generate{background:#6366f1;color:white}
.back{background:#334155;color:white}
#status{margin-top:16px;padding:12px;border-radius:12px;background:#1e293b;white-space:pre-wrap}
#result{margin-top:18px;padding:10px;min-height:140px;text-align:center;background:#020617;border:1px solid #334155;border-radius:18px;overflow:hidden}
#result img{display:block;width:100%;max-width:100%;height:auto;max-height:none;margin:auto;object-fit:contain;border-radius:14px}
.small{color:#cbd5e1;text-align:center}
</style>

<style id="sk_all_logo_spin_v2">
@keyframes skAllLogoSpinV2 {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
</style>

</head>
<body>

<!-- SASIKUMAR AI BRAND HEADER -->
<div id="skGlobalBrandHeader" style="box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:9px 14px;margin:0 0 12px;background:linear-gradient(110deg,#071b38,#123f65,#075b55);color:#fff;border-bottom:2px solid #d8b54a;font-family:Arial,sans-serif;position:relative;z-index:5;">
  <img src="/assets/sasikumar-ai-logo.png?v=20261010" alt="SASIKUMAR AI"
       style="display:block;width:42px;height:42px;min-width:42px;object-fit:contain;cursor:pointer;transition:transform .5s ease;"
       onclick="this.style.transform='rotate(360deg)';setTimeout(()=>this.style.transform='',550)">
  <div style="min-width:0;">
    <div style="font-size:16px;font-weight:800;letter-spacing:.5px;line-height:1.35;">SASIKUMAR AI</div>
    <div style="font-size:11px;opacity:.88;line-height:1.4;">Smart Digital Services</div>
  </div>
</div>
<!-- END SASIKUMAR AI BRAND HEADER -->

<div class="wrap">
<div class="card">
<h1>🖼️ SASIKUMAR AI Image Maker</h1>
<p class="small">Describe the image you want to create.</p>

<textarea id="prompt" placeholder="Example: A beautiful peacock in a natural garden, realistic digital art"></textarea>

<button class="generate" onclick="generateImage()">✨ Generate Image</button>
<button type="button" class="generate" style="background:#0f766e" onclick="generateImageWithHF()">🤗 Generate with Hugging Face</button>
<button type="button" class="back" onclick="downloadPosterPNG()">⬇️ Download Poster PNG</button>

<div class="tool-title">🛠️ All Tools</div>
<div class="tool-grid">
<button type="button" onclick="openCamera()">📷 Camera</button>
<button type="button" onclick="openUpload()">📤 Upload</button>
<button type="button" onclick="selectPrompt()">☑️ Select</button>
<button type="button" onclick="pasteImage()">📋 Paste Image</button>
<button type="button" onclick="sharePrompt()">📤 Share</button>
<button type="button" onclick="cutPrompt()">✂️ Cut</button>
<button type="button" onclick="copyPrompt()">📋 Copy</button>
<button type="button" onclick="pastePrompt()">📥 Paste Text</button>
</div>

<input id="cameraInput" class="hidden-file" type="file" accept="image/*" capture="environment" onchange="showSelectedImage(this)">
<input id="uploadInput" class="hidden-file" type="file" accept="image/*" onchange="showSelectedImage(this)">
<button class="back" onclick="location.href='/'">⬅️ Back to SASIKUMAR AI</button>

<div id="status"></div>
<div id="result"></div>
</div>
</div>

<script>
function openCamera(){document.getElementById("cameraInput").click();}
function openUpload(){
  const input = document.getElementById("uploadInput");
  if (!input) {
    alert("Image upload input not found. Please refresh the page.");
    return;
  }

  // Open Android's file picker directly from the Upload button.
  input.value = "";
  try {
    input.click();
  } catch (err) {
    console.error("Image upload error:", err);
    input.removeAttribute("hidden");
    input.style.display = "block";
    input.style.position = "fixed";
    input.style.left = "10px";
    input.style.bottom = "10px";
    input.style.zIndex = "99999";
    input.style.opacity = "1";
    input.style.width = "90%";
    input.style.height = "48px";
    alert("Tap the file selection control to choose an image.");
  }
}
function selectPrompt(){const e=document.getElementById("prompt");e.focus();e.select();}

function showSelectedImage(input){
 const file=input.files&&input.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=function(e){
   const r=document.getElementById("result");
   r.innerHTML="";
   const img=document.createElement("img");
   img.src=e.target.result;
   img.alt="Selected image preview";
   r.appendChild(img);
   document.getElementById("status").textContent="✅ Image preview ready.";
 };
 reader.readAsDataURL(file);
}

async function pasteImage(){
 try{
   const items=await navigator.clipboard.read();
   for(const item of items){
     const type=item.types.find(t=>t.startsWith("image/"));
     if(type){
       const blob=await item.getType(type);
       const r=document.getElementById("result");
       r.innerHTML="";
       const img=document.createElement("img");
       img.src=URL.createObjectURL(blob);
       img.alt="Pasted image preview";
       r.appendChild(img);
       document.getElementById("status").textContent="✅ Image pasted.";
       return;
     }
   }
   alert("No image found in clipboard.");
 }catch(e){
   alert("📋 Image paste permission unavailable. Please use Upload.");
 }
}

async function sharePrompt(){
  const text=document.getElementById("prompt").value.trim();
  if(!text){alert("Enter image description first.");return;}
  if(navigator.share){
    try{await navigator.share({title:"SASIKUMAR AI Image Maker",text});}
    catch(e){}
  }else{
    await navigator.clipboard.writeText(text);
    alert("Copied. You can share it now.");
  }
}
async function copyPrompt(){
  const el=document.getElementById("prompt");
  if(!el.value){alert("Enter image description first.");return;}
  await navigator.clipboard.writeText(el.value);
  alert("✅ Copied");
}
async function cutPrompt(){
  const el=document.getElementById("prompt");
  if(!el.value){alert("Enter image description first.");return;}
  await navigator.clipboard.writeText(el.value);
  el.value="";
  alert("✂️ Cut");
}
async function pastePrompt(){
  const el=document.getElementById("prompt");
  try{
    el.value=await navigator.clipboard.readText();
    el.focus();
  }catch(e){
    alert("📥 Paste permission is unavailable. Please paste manually.");
  }
}


/* SK_LOCAL_POSTER_PNG_V1 */
let skLocalPosterUrl = '';

function skEscapeXml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&apos;'
  })[ch]);
}

function skWrapPosterText(value, maxChars) {
  const words = String(value).split(/\s+/);
  const lines = [];
  let line = '';

  for (const word of words) {
    if (!word) continue;

    if ((line + ' ' + word).trim().length > maxChars && line) {
      lines.push(line);
      line = word;
    } else {
      line = (line + ' ' + word).trim();
    }
  }

  if (line) lines.push(line);
  return lines.slice(0, 12);
}

function createLocalPoster(prompt) {
  const safePrompt = String(prompt || '').trim();

  if (!safePrompt) {
    throw new Error('Please enter poster content first.');
  }

  const lines = skWrapPosterText(safePrompt,  thirtyChars());
  const textSvg = lines.map((line, index) =>
    '<text x="540" y="' + (570 + index * 58) +
    '" text-anchor="middle" font-family="Arial,sans-serif" ' +
    'font-size="31" fill="#ffffff">' +
    skEscapeXml(line) + '</text>'
  ).join('');

  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">' +
    '<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="#075985"/>' +
    '<stop offset="0.55" stop-color="#4338ca"/>' +
    '<stop offset="1" stop-color="#7e22ce"/>' +
    '</linearGradient></defs>' +
    '<rect width="1080" height="1350" rx="42" fill="url(#bg)"/>' +
    '<rect x="35" y="35" width="1010" height="1280" rx="30" fill="none" stroke="#facc15" stroke-width="7"/>' +
    '<circle cx="540" cy="245" r="112" fill="#ffffff" opacity=".13"/>' +
    '<text x="540" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="68" font-weight="bold" fill="#facc15">SK</text>' +
    '<text x="540" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="57" font-weight="bold" fill="#ffffff">SASIKUMAR AI</text>' +
    '<text x="540" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#e0f2fe">YOUR IDEA • YOUR POSTER</text>' +
    textSvg +
    '<rect x="210" y="1120" width="660" height="3" fill="#facc15"/>' +
    '<text x="540" y="1185" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#facc15">CREATED WITH SASIKUMAR AI</text>' +
    '<text x="540" y="1240" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#ffffff">Smart Digital Services</text>' +
    '</svg>';

  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function thirtyChars() {
  return 30;
}

function makeLocalPoster(prompt) {
  const result = document.getElementById('result');
  const status = document.getElementById('status');

  skLocalPosterUrl = createLocalPoster(prompt);

  result.innerHTML = '';
  const img = document.createElement('img');
  img.src = skLocalPosterUrl;
  img.alt = 'SASIKUMAR AI local poster';
  result.appendChild(img);

  status.textContent =
    '✅ Local poster created. Tap Download Poster PNG to save it.';
}

async function downloadPosterPNG() {
  if (!skLocalPosterUrl) {
    const prompt = document.getElementById('prompt').value.trim();

    if (!prompt) {
      document.getElementById('status').textContent =
        'Please enter a description first.';
      return;
    }

    try {
      makeLocalPoster(prompt);
    } catch (err) {
      document.getElementById('status').textContent = '❌ ' + err.message;
      return;
    }
  }

  const status = document.getElementById('status');
  const image = new Image();

  image.onload = function () {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 1080;
      canvas.height = 1350;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(blob => {
        if (!blob) {
          status.textContent = '❌ PNG export failed. Please try again.';
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'sasikumar-ai-poster.png';
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 2000);
        status.textContent = '✅ Poster PNG download started.';
      }, 'image/png');
    } catch (err) {
      status.textContent = '❌ PNG export failed: ' + err.message;
    }
  };

  image.onerror = function () {
    status.textContent = '❌ Poster preview could not be loaded.';
  };

  image.src = skLocalPosterUrl;
}
/* END SK_LOCAL_POSTER_PNG_V1 */


async function generateImage() {
  const prompt = document.getElementById('prompt').value.trim();
  const status = document.getElementById('status');
  const result = document.getElementById('result');

  result.innerHTML = '';

  if (!prompt) {
    status.textContent = 'Please enter an image description.';
    return;
  }

  status.textContent = '⏳ Trying AI image generation...';

  try {
    const response = await fetch('/api/ai/image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    const data = await response.json();

    if (data.ok && data.imageUrl) {
      skLocalPosterUrl = '';
      const img = document.createElement('img');
      img.src = data.imageUrl;
      img.alt = prompt;
      result.appendChild(img);
      status.textContent = '✅ AI image generated successfully.';
      return;
    }

    status.textContent =
      'ℹ️ AI image unavailable. Creating a local poster instead...';
    makeLocalPoster(prompt);

  } catch (error) {
    status.textContent =
      'ℹ️ AI image service unavailable. Creating a local poster instead...';

    try {
      makeLocalPoster(prompt);
    } catch (localError) {
      status.textContent = '❌ ' + localError.message;
    }
  }
}

// SK_HUGGINGFACE_IMAGE_UI_V1
async function generateImageWithHF() {
  const prompt = document.getElementById('prompt').value.trim();
  const status = document.getElementById('status');
  const result = document.getElementById('result');

  result.innerHTML = '';

  if (!prompt) {
    status.textContent = 'Please enter an image description.';
    return;
  }

  status.textContent = '⏳ Generating image with Hugging Face...';

  try {
    const response = await fetch('/api/ai/image/huggingface', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    const data = await response.json();

    if (!response.ok || !data.ok || !data.imageUrl) {
      throw new Error(data.error || `Request failed (${response.status})`);
    }

    skLocalPosterUrl = '';

    const img = document.createElement('img');
    img.src = data.imageUrl;
    img.alt = prompt;
    result.appendChild(img);

    status.textContent = '✅ Hugging Face image generated successfully.';
  } catch (error) {
    status.textContent = '❌ Hugging Face image generation failed: ' + error.message;
  }
}
// END SK_HUGGINGFACE_IMAGE_UI_V1

</script>

<script id="sk_all_logo_spin_v2-script">
(function () {
  function spinLogo(img) {
    if (!img || !/sasikumar-ai-logo\.png/i.test(img.getAttribute('src') || '')) return;
    img.style.setProperty('animation', 'skAllLogoSpinV2 3s linear infinite', 'important');
  }
  function scan(root) {
    if (root.matches && root.matches('img')) spinLogo(root);
    if (root.querySelectorAll) root.querySelectorAll('img').forEach(spinLogo);
  }
  scan(document);
  new MutationObserver(function (records) {
    records.forEach(function (record) {
      if (record.type === 'attributes') spinLogo(record.target);
      else record.addedNodes.forEach(function (node) {
        if (node.nodeType === 1) scan(node);
      });
    });
  }).observe(document.documentElement, {
    subtree: true, childList: true, attributes: true, attributeFilter: ['src']
  });
})();
</script>
