services:
  - type: web
    name: sasikumar-ai-growth
    runtime: node
    plan: free
    buildCommand: npm install && python -m pip install -r requirements.txt && python3 -m pip install -r requirements.txt
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
